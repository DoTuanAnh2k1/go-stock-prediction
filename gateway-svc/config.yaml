server:
  host: "0.0.0.0"
  http_port: 80
  https_port: 443
  tls:
    enabled: true
    cert_path: "/etc/gateway/certs/cert.pem"
    key_path: "/etc/gateway/certs/key.pem"
  shutdown_timeout: 30

http:
  version: "auto"
  pool:
    max_idle_per_host: 20
    idle_timeout: 90
    connection_timeout: 10
  request:
    timeout: 600
    max_retries: 0
    retry_delay: 1

# Path-prefix routing — longest prefix wins.
# /swagger → 404 blocked
# /health  → api-svc aggregate Service (both colors) — nginx-compat health path
# /api, /  → managed by the `bluegreen` block below (per-color routing)
routes:
  - prefix: "/swagger"
    action: "block"
  - prefix: "/health"
    action: "proxy"
    backend: "http://api-svc:8118"
    security_headers: false

# Blue/green automation — gateway routes each prefix to the active color's Service,
# watches Deployments, and auto-promotes/rolls back. See docs/specs.
bluegreen:
  enabled: true
  analysis:
    window_seconds: 60
    success_threshold: 0.99
    min_requests: 20
    max_window_multiplier: 3
    failure_status_from: 500
  apps:
    - name: web-svc
      prefix: "/"
      namespace: stock
      blue:  { deployment: web-svc-blue,  backend: "http://web-svc-blue:3000" }
      green: { deployment: web-svc-green, backend: "http://web-svc-green:3000" }
      default_active: green
    - name: api-svc
      prefix: "/api"
      namespace: stock
      blue:  { deployment: api-svc-blue,  backend: "http://api-svc-blue:8118" }
      green: { deployment: api-svc-green, backend: "http://api-svc-green:8118" }
      default_active: green

middleware:
  rate_limit:
    enabled: true
    max_requests: 60
    window_secs: 1

logging:
  level: "info"
  format: "json"
  access_log: true
