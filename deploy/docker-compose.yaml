# Compose file lives in deploy/. Relative paths below are resolved against this
# directory, so repo-root paths are referenced with ../ (e.g. ../database.sql).
# Run from the repo root with:
#   docker compose --env-file .env -f deploy/docker-compose.yaml up -d
# (the Makefile wraps this — see `make up` / `make reset`).
#
# Project name is pinned to go-stock-prediction so that moving this compose file
# into deploy/ does NOT change the Compose project (which defaults to the file's
# parent dir). This keeps reusing the existing named volumes
# (go-stock-prediction_postgres_data / _backup_data) instead of creating empty ones.
name: go-stock-prediction
services:
  # Database — TimescaleDB (PostgreSQL 16 with time-series extensions)
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - backup_data:/backups          # ofelia daily-backup ghi pg_dump vào đây (parity với k8s daily-backup CronJob)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-go_stock_prediction}
      PGTZ: Asia/Ho_Chi_Minh
    # Ofelia daily_backup (thay BackupScheduler in-app của api-svc). $$ = escape để
    # compose KHÔNG nội suy — sh trong container db mới đánh giá $ lúc chạy.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.daily-backup.schedule: "0 0 3 * * *"
      ofelia.job-exec.daily-backup.command: 'sh -c "PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz; ls -1t /backups/backup_*.sql.gz | tail -n +11 | xargs -r rm -f"'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_stock_prediction"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "5432:5432"
    networks:
      - app-network

  # Prediction Service (gRPC) — Python implementation.
  # Build context is the repo root because the Dockerfile pulls the shared proto
  # from api-svc/proto in addition to prediction-svc/ sources.
  prediction-svc:
    build:
      context: ..
      dockerfile: deploy/prediction-svc.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: prediction-svc
    depends_on:
      db:
        condition: service_healthy
      service-mgt:
        condition: service_started
    restart: unless-stopped
    environment:
      GRPC_SERVER_PORT: "8119"
      SERVICE_MGT_ENABLED: "${SERVICE_MGT_ENABLED:-false}"
      REGISTRY_GRPC_TARGET: "service-mgt:8121"
      DB_DRIVER: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: go_stock_prediction
      POSTGRES_DEBUG: "${POSTGRES_DEBUG:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://localhost}"
      RL_MODEL_DIR: "${RL_MODEL_DIR:-/models}"
      PER_SYMBOL_ENABLED: "${PER_SYMBOL_ENABLED:-false}"
      PER_SYMBOL_MIN_POINTS: "${PER_SYMBOL_MIN_POINTS:-80}"
      PER_SYMBOL_WORKERS: "${PER_SYMBOL_WORKERS:-0}"
      # Parity với k8s: KHÔNG chạy APScheduler in-app. Mọi lịch do ofelia
      # (cron container) gọi `python -m src.jobs_cli <job>` — xem labels bên dưới.
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-false}"
    volumes:
      - rl_models:/models
      - version_data:/versions
    networks:
      - app-network
    # Ofelia job-exec: cron container exec vào prediction-svc chạy jobs_cli (dùng
    # cùng JOB_FUNCTIONS như k8s CronJob). Cron 6-field = giống DEFAULT_SCHEDULES.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.crawler-gold.schedule: "0 0 * * * *"
      ofelia.job-exec.crawler-gold.command: "python -m src.jobs_cli gold"
      ofelia.job-exec.crawler-nasdaq.schedule: "0 15,45 * * * *"
      ofelia.job-exec.crawler-nasdaq.command: "python -m src.jobs_cli nasdaq"
      ofelia.job-exec.crawler-crypto.schedule: "0 0 * * * *"
      ofelia.job-exec.crawler-crypto.command: "python -m src.jobs_cli crypto"
      ofelia.job-exec.crawler-sp500.schedule: "0 0,30 * * * *"
      ofelia.job-exec.crawler-sp500.command: "python -m src.jobs_cli sp500"
      ofelia.job-exec.train-gold.schedule: "0 0 3 * * 0"
      ofelia.job-exec.train-gold.command: "python -m src.jobs_cli train_gold"
      ofelia.job-exec.train-nasdaq.schedule: "0 0 4 * * 0"
      ofelia.job-exec.train-nasdaq.command: "python -m src.jobs_cli train_nasdaq"
      ofelia.job-exec.train-crypto.schedule: "0 0 5 * * 0"
      ofelia.job-exec.train-crypto.command: "python -m src.jobs_cli train_crypto"
      ofelia.job-exec.train-sp500.schedule: "0 0 7 * * 0"
      ofelia.job-exec.train-sp500.command: "python -m src.jobs_cli train_sp500"
      ofelia.job-exec.train-meta.schedule: "0 0 8 * * 0"
      ofelia.job-exec.train-meta.command: "python -m src.jobs_cli train_meta"
      ofelia.job-exec.crawler-fundamentals.schedule: "0 0 6 * * 6"
      ofelia.job-exec.crawler-fundamentals.command: "python -m src.jobs_cli crawler_fundamentals"
      ofelia.job-exec.train-transformer.schedule: "0 30 2 * * 1,3,5"
      ofelia.job-exec.train-transformer.command: "python -m src.jobs_cli train_transformer"
      ofelia.job-exec.daily-reconcile.schedule: "0 0 6 * * *"
      ofelia.job-exec.daily-reconcile.command: "python -m src.jobs_cli daily_reconcile"

  # Auth Service (Java gRPC)
  auth-svc:
    build:
      context: ../auth-svc
      dockerfile: ../deploy/auth-svc.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: auth-svc
    depends_on:
      db:
        condition: service_healthy
      service-mgt:
        condition: service_started
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: go_stock_prediction
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: "8120"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      SERVICE_MGT_ENABLED: "${SERVICE_MGT_ENABLED:-false}"
      REGISTRY_GRPC_TARGET: "service-mgt:8121"
    expose:
      - "8120"
    volumes:
      - version_data:/versions
    networks:
      - app-network

  # Service Management (registry / discovery — Go gRPC)
  service-mgt:
    build:
      context: ../service-mgt
      dockerfile: ../deploy/service-mgt.Dockerfile
    container_name: service-mgt
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GRPC_PORT: "8121"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: go_stock_prediction
      LOG_FORMAT: "${LOG_FORMAT:-console}"
    expose:
      - "8121"
    networks:
      - app-network

  # API Backend (HTTP)
  api-svc:
    build:
      # Repo-root context so the sibling service-mgt module is available.
      context: ..
      dockerfile: deploy/api-svc.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: api-svc
    depends_on:
      db:
        condition: service_healthy
      prediction-svc:
        condition: service_started
      auth-svc:
        condition: service_started
      service-mgt:
        condition: service_started
    restart: unless-stopped
    environment:
      SERVER_PORT: "8118"
      GRPC_TARGET: "prediction-svc:8119"
      SERVICE_MGT_ENABLED: "${SERVICE_MGT_ENABLED:-false}"
      REGISTRY_GRPC_TARGET: "service-mgt:8121"
      DB_DRIVER: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: go_stock_prediction
      POSTGRES_DEBUG: "${POSTGRES_DEBUG:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_LOG_LEVEL: "${DB_LOG_LEVEL:-WARN}"
      API_KEY: ""
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      BACKUP_DIR: "/backups"
      # Parity với k8s: KHÔNG chạy BackupScheduler in-app. Backup do ofelia gọi
      # pg_dump trên container db (xem labels service db).
      BACKUP_SCHEDULER_ENABLED: "${BACKUP_SCHEDULER_ENABLED:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://localhost}"
      AUTH_GRPC_TARGET: "auth-svc:8120"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      DOCS_ROOT: "/repo"
    volumes:
      - backup_data:/backups
      - version_data:/versions
      - ../:/repo:ro
    networks:
      - app-network

  # Rust HTTP/HTTPS Gateway — handles ports 80/443, routes to api-svc and web-svc
  gateway-svc:
    build:
      context: ../gateway-svc
      dockerfile: ../deploy/gateway-svc.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: gateway-svc
    depends_on:
      - api-svc
      - web-svc
      - service-mgt
    restart: unless-stopped
    environment:
      SERVICE_MGT_ENABLED: "${SERVICE_MGT_ENABLED:-false}"
      REGISTRY_GRPC_TARGET: "service-mgt:8121"
      LOG_FORMAT: "${LOG_FORMAT:-console}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../gateway-svc/certs:/etc/gateway/certs
      - version_data:/versions
    networks:
      - app-network

  # Frontend (React + Vite + Nginx) — serves static files on internal port 3000
  web-svc:
    build:
      context: ../web-svc
      dockerfile: ../deploy/web-svc.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_DIRTY: ${GIT_DIRTY:-unknown}
    container_name: web-svc
    depends_on:
      - api-svc
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - version_data:/versions
    networks:
      - app-network

  # pgAdmin — PostgreSQL web administration UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - app-network

  # CLI Service — interactive SSH shell (wish + Bubble Tea) for headless servers.
  # Renders API data as tables; enforces per-command RBAC. SSH exposed directly on
  # 2345 (gateway speaks HTTP only); all API calls go through the gateway.
  cli-svc:
    build:
      context: ../cli-svc
      dockerfile: ../deploy/cli-svc.Dockerfile
    container_name: cli-svc
    depends_on:
      - gateway-svc
    restart: unless-stopped
    environment:
      API_BASE_URL: "http://gateway-svc/api"
      SSH_LISTEN_ADDR: ":2345"
      SSH_HOST_KEY_PATH: "/etc/cli-svc/keys/host_key"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
    ports:
      - "2345:2345"
    volumes:
      # Named volume (not a bind mount): docker seeds it with the image's
      # cli:cli ownership so wish can chmod/persist the generated SSH host key.
      - cli_keys:/etc/cli-svc/keys
    networks:
      - app-network

  # Ofelia — container-native cron. Thay APScheduler in-app của prediction-svc và
  # BackupScheduler của api-svc để ĐỒNG BỘ (parity) cơ chế lịch với k8s CronJob:
  # cùng gọi `python -m src.jobs_cli <job>` / pg_dump. Đọc labels ofelia.* trên các
  # container qua Docker socket (read-only). Lịch định nghĩa ở labels service db +
  # prediction-svc. Xem factor 10 (dev/prod parity) trong spec 15-factor.
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    depends_on:
      - prediction-svc
      - db
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backup_data:
  cli_keys:
  rl_models:
  # Shared version stamps — each service writes /versions/<service>.json at startup;
  # api-svc reads them all for GET /api/version. See Makefile (GIT_SHA/BUILD_TIME/GIT_DIRTY).
  version_data:
