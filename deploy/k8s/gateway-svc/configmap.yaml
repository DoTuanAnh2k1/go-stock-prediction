# =============================================================================
# gateway-svc — env không nhạy cảm (Rust Axum :80/:443).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: stock
data:
  SERVICE_MGT_ENABLED: "false"
  REGISTRY_GRPC_TARGET: "service-mgt:8121"
  LOG_FORMAT: console
  # --- Observability (factor 14): OTLP tracing → OTel Collector → Tempo ---
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "gateway-svc"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=stock,deployment.environment=kind"
  # Prometheus /metrics admin listener (separate from public :80/:443 proxy).
  ADMIN_PORT: "9100"
