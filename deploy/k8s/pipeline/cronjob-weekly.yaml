---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-reconcile
  namespace: stock
  labels: { app: pipeline, kind: reconcile }
spec:
  schedule: "0 6 * * *"             # 6AM ICT mỗi ngày — catch-all (pipeline đã reconcile per-market)
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          restartPolicy: Never
          dnsConfig: { options: [ { name: ndots, value: "1" } ] }
          initContainers:
            - name: wait-db
              image: timescale/timescaledb:latest-pg16
              imagePullPolicy: IfNotPresent
              command: ["sh","-c","until pg_isready -h db -p 5432 -U postgres; do echo 'db not ready'; sleep 2; done"]
          containers:
            - name: reconcile
              image: prediction-svc:dev
              imagePullPolicy: IfNotPresent
              command: ["python","-m","src.jobs_cli","daily_reconcile"]
              envFrom:
                - configMapRef: { name: prediction-config }
                - secretRef:    { name: prediction-secret }
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits:   { cpu: "1000m", memory: "1Gi" }
