# =============================================================================
# CronJob PHỤ TRỢ — fundamentals (feed transformer_nn), transformer refresh,
# reconcile catch-all. Thay APScheduler in-app; chạy qua jobs_cli.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawler-fundamentals
  namespace: stock
  labels: { app: pipeline, kind: fundamentals }
spec:
  schedule: "0 6 * * 6"             # Thứ Bảy 6AM ICT
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          dnsConfig: { options: [ { name: ndots, value: "1" } ] }
          initContainers:
            - name: wait-db
              image: timescale/timescaledb:latest-pg16
              imagePullPolicy: IfNotPresent
              command: ["sh","-c","until pg_isready -h db -p 5432 -U postgres; do echo 'db not ready'; sleep 2; done"]
          containers:
            - name: job
              image: prediction-svc:dev
              imagePullPolicy: IfNotPresent
              command: ["python","-m","src.jobs_cli","crawler_fundamentals"]
              envFrom:
                - configMapRef: { name: prediction-config }
                - secretRef:    { name: prediction-secret }
              resources:
                requests: { cpu: "250m", memory: "512Mi" }
                limits:   { cpu: "1500m", memory: "2Gi" }
---
