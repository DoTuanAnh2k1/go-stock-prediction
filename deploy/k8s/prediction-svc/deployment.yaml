# =============================================================================
# prediction-svc — Python gRPC (:8119). Crawling + 13 thuật toán ML + scheduler.
#
# Build & load image (repo root, vì Dockerfile lấy proto từ api-svc/):
#   docker build -t prediction-svc:dev -f deploy/prediction-svc.Dockerfile .
#   kind load docker-image prediction-svc:dev --name ckad
#
# Yêu cầu: DB Ready trước (SQLAlchemy connect lúc khởi động).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-svc
  namespace: stock
  labels: { app: prediction-svc }
spec:
  replicas: 2
  selector:
    matchLabels: { app: prediction-svc }
  template:
    metadata:
      labels: { app: prediction-svc }
      annotations:
        # Prometheus pod scrape annotations (kubernetes_sd)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      # dnsConfig ndots:1 — mạng hotspot/ISP hijack NXDOMAIN: ndots:5 mặc định nối
      # search-domain rác (tailf643c3.ts.net / DHCP rò từ resolv.conf host) vào tên
      # external (crawler_fundamentals yfinance, ...) → ISP trả IP parking → connect
      # timeout. ndots:1 ép query FQDN trước → IP thật. Tên in-cluster 1 nhãn 0 dots
      # (db, service-mgt) vẫn expand bình thường.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # ---- initContainer wait-db: chờ DB Ready (pg_isready) rồi SQLAlchemy mới connect ----
      # Giống api-svc, nhưng image prediction-svc (Python) không có pg_isready nên dùng
      # image timescaledb (đã có sẵn trong cluster vì db dùng chung) chỉ để chạy pg_isready.
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for db:5432 ..."
              until pg_isready -h db -p 5432 -U postgres; do
                echo "db not ready, retry in 2s"; sleep 2
              done
              echo "db is ready"
      containers:
        - name: prediction-svc
          image: prediction-svc:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8119
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef: { name: prediction-config }
            - secretRef:    { name: prediction-secret }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1500m", memory: "2Gi" }   # torch/ML nặng RAM
          # ---- Health probes: native gRPC (k8s >= 1.24) ----
          # prediction-svc gRPC server KHÔNG đăng ký grpc.health.v1 → native grpc: probe
          # báo "Method not found" và giết pod. Dùng tcpSocket:8119 — TCP connect tới cổng
          # gRPC chứng minh server đang listen (đủ cho readiness/liveness). Muốn native grpc:
          # thì thêm grpc_health.v1 HealthServicer vào server.py + grpcio-health-checking.
          readinessProbe:
            tcpSocket:
              port: 8119
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8119
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          # emptyDir — ephemeral local cache (model files are read-through from S3/MinIO
          # at load time when MODEL_STORE_BACKEND=s3; populated per-pod on first load).
          # PVC (rl-models) no longer needed: replicas=2 + RWO PVC would require ReadWriteMany.
          emptyDir: {}
