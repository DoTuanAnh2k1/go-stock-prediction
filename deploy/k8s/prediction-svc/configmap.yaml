# =============================================================================
# prediction-svc — env không nhạy cảm (Python gRPC :8119).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-config
  namespace: stock
data:
  GRPC_SERVER_PORT: "8119"
  SERVICE_MGT_ENABLED: "false"
  REGISTRY_GRPC_TARGET: "service-mgt:8121"
  DB_DRIVER: postgresql
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_DB: go_stock_prediction
  POSTGRES_DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_FORMAT: console
  ALLOWED_ORIGINS: "https://localhost"
  RL_MODEL_DIR: "/models"
  PER_SYMBOL_ENABLED: "false"
  PER_SYMBOL_MIN_POINTS: "80"
  PER_SYMBOL_WORKERS: "0"
