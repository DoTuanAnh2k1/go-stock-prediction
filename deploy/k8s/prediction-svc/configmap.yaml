# =============================================================================
# prediction-svc — env không nhạy cảm (Python gRPC :8119).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-config
  namespace: stock
data:
  GRPC_SERVER_PORT: "8119"
  SERVICE_MGT_ENABLED: "false"
  REGISTRY_GRPC_TARGET: "service-mgt:8121"
  DB_DRIVER: postgresql
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_DB: go_stock_prediction
  POSTGRES_DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_FORMAT: console
  ALLOWED_ORIGINS: "https://localhost"
  RL_MODEL_DIR: "/models"
  PER_SYMBOL_ENABLED: "false"
  PER_SYMBOL_MIN_POINTS: "80"
  PER_SYMBOL_WORKERS: "0"
  # ---- Factor 10: Scheduler disabled — k8s CronJob manifests drive scheduling ----
  SCHEDULER_ENABLED: "false"
  # ---- Factor 4/6/8: Stateless — checkpoints stored in MinIO ----
  MODEL_STORE_BACKEND: "s3"
  S3_ENDPOINT: "http://minio.stock:9000"
  S3_BUCKET: "models"
  # ---- Factor 14: OpenTelemetry tracing ----
  OTEL_SERVICE_NAME: "prediction-svc"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=stock,deployment.environment=kind"
