# =============================================================================
# prediction-svc — ClusterIP gRPC :8119 (api-svc gọi qua GRPC_TARGET).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: prediction-svc
  namespace: stock
spec:
  selector: { app: prediction-svc }
  ports:
    # targetPort → ambassador nginx (:18119) → grpc_pass app :8119.
    # Service port giữ 8119 nên api-svc (GRPC_TARGET=prediction-svc:8119) không đổi.
    - port: 8119
      targetPort: 18119
