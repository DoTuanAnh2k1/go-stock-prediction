// ===========================================================================
// RENDER
// ===========================================================================
const $ = s => document.querySelector(s);
const days = Object.keys(DATA);
let curDay = days[0], curLab = 0;
const open = {};   // day -> bool (mặc định mở)

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hiOut(s){
  return esc(s)
    .replace(/\b(Complete|Running|created|configured|labeled|annotated|PASS|ready=true|exit 0|successfully rolled out|condition met)\b/g,'<span class="ok">$1</span>')
    .replace(/\b(Error|Failed|FAIL|error|deleted|unlabeled|BackoffLimitExceeded|exitCode=1)\b/g,'<span class="bad">$1</span>');
}

function renderNav(){
  $("#nav").innerHTML = days.map(d=>{
    const isOpen = open[d]!==false;
    const labs = DATA[d].map((l,i)=>`
      <button class="lab ${(d===curDay&&i===curLab)?'on':''}" data-day="${d}" data-i="${i}">
        <span class="id">${l.id}</span>
        <span class="t">${l.title}</span>
        <span class="meta">${l.duration} · <span class="st-${l.status}">${l.status.toUpperCase()}</span></span>
      </button>`).join("");
    return `<div class="day-group">
        <div class="day" data-day="${d}"><span class="caret">${isOpen?'▾':'▸'}</span> ${d}</div>
        <div class="day-labs ${isOpen?'':'collapsed'}">${labs}</div>
      </div>`;
  }).join("");
  document.querySelectorAll('#nav .day').forEach(h=>h.onclick=()=>{
    const d=h.dataset.day; open[d] = !(open[d]!==false); renderNav();
  });
  document.querySelectorAll('#nav .lab').forEach(b=>b.onclick=()=>{
    curDay=b.dataset.day; curLab=+b.dataset.i; renderNav(); renderMain();
  });
}

function cmdBlock(cmds){
  return cmds.map((c,i)=>{
    const noteHtml = c.note ? `  <span class="note"># ${esc(c.note)}</span>` : "";
    const outHtml = c.out ? `<pre class="cmd-out">${hiOut(c.out)}</pre>` : "";
    return `<div class="cmd">
        <div class="code"><span class="prompt">$</span> ${esc(c.cmd)}${noteHtml}</div>
        <button class="cp" data-i="${i}">copy</button>
      </div>${outHtml}`;
  }).join("");
}

let curSecs = [];
function sectionsOf(l){
  const s = [
    {id:"request", label:"Request", icon:"◎", title:"Request — yêu cầu",
      html:`<div class="body"><p>${esc(l.request)}</p></div>`},
    {id:"know", label:"Kiến thức", icon:"✦", title:"Kiến thức cần biết",
      html:`<div class="body"><ul class="know">${l.knowledge.map(k=>`<li>${k}</li>`).join("")}</ul></div>`}
  ];
  if(l.prep && l.prep.length) s.push({id:"prep", label:"Chuẩn bị", icon:"⚑", title:"Chuẩn bị (prereq)",
      html:`<div class="body"><ul class="know">${l.prep.map(k=>`<li>${k}</li>`).join("")}</ul></div>`});
  if(l.steps && l.steps.length) s.push({id:"steps", label:"Các bước", icon:"◷", title:"Các bước chạy",
      html:`<ol class="steps">${l.steps.map(x=>`<li>${x}</li>`).join("")}</ol>`});
  s.push({id:"cmds", label:"Lệnh", icon:"$", title:"Lệnh execute + output từng lệnh",
      html:`<div class="cmds">${cmdBlock(l.commands)}</div>`});
  if(l.cleanup && l.cleanup.length) s.push({id:"cleanup", label:"Dọn dẹp", icon:"✕", title:"Dọn dẹp (cleanup)",
      html:`<div class="body"><ul class="know">${l.cleanup.map(k=>`<li>${k}</li>`).join("")}</ul></div>`});
  if(l.tool) s.push({id:"tool", label:"Tool test", icon:"⚙", title:"Tool test (giả lập end-to-end)",
      html:`<pre class="out tool">${esc(l.tool)}</pre>`});
  return s;
}
function spyToc(){
  let cur = curSecs[0] && curSecs[0].id;
  for(const x of curSecs){ const el=document.getElementById("sec-"+x.id); if(el && el.getBoundingClientRect().top - 90 <= 0) cur = x.id; }
  document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("on", a.dataset.sec==="sec-"+cur));
}
function renderMain(){
  const l = DATA[curDay][curLab];
  curSecs = sectionsOf(l);
  $("#main").innerHTML = `
    <h2 class="title">${l.id} · ${l.title}</h2>
    <div class="badges">
      <span class="badge ${l.status}">${l.status.toUpperCase()}</span>
      <span class="badge">${l.domain}</span>
      <span class="badge">${l.duration}</span>
    </div>
    ${curSecs.map(x=>`<section id="sec-${x.id}"><div class="h"><span class="k">${x.icon}</span> ${x.title}</div>${x.html}</section>`).join("")}
    <div class="foot">CKAD labs · nguồn: deploy/k8s/ckad-labs/day_*/lab.md · harness: day_2/e2e-test.sh</div>`;
  // mục lục
  $("#toc").innerHTML = `<div class="lbl">Trong lab này</div>` +
    curSecs.map(x=>`<a data-sec="sec-${x.id}">${x.label}</a>`).join("");
  document.querySelectorAll("#toc a").forEach(a=>a.onclick=()=>{
    const el=document.getElementById(a.dataset.sec); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
  });
  // copy
  document.querySelectorAll("#main .cp").forEach(btn=>btn.onclick=()=>{
    const raw = DATA[curDay][curLab].commands[+btn.dataset.i].cmd.replace(/\\\n\s*/g," ");
    navigator.clipboard.writeText(raw).then(()=>{btn.textContent="copied";setTimeout(()=>btn.textContent="copy",1200);});
  });
  window.scrollTo(0, 0);
  spyToc();
}

window.addEventListener("scroll", spyToc, true);  // capture=true để bắt cả scroll của <main>
renderNav();
renderMain();
</script>
