<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CKAD Labs — go-stock-prediction (kind ckad)</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2430; --line:#2b3441;
    --fg:#c9d1d9; --dim:#8b949e; --accent:#3fb950; --accent2:#58a6ff;
    --amber:#d29922; --red:#f85149; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .wrap{display:grid;grid-template-columns:288px 1fr;min-height:calc(100vh - 53px)}
  nav{background:var(--bg2);border-right:1px solid var(--line);padding:10px;overflow:auto}
  .day{display:flex;align-items:center;gap:7px;padding:9px 10px;cursor:pointer;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--fg);user-select:none}
  .day:hover{background:var(--bg3)}
  .day .caret{color:var(--dim);width:12px;display:inline-block}
  .day-labs.collapsed{display:none}
  .day-labs{margin:2px 0 8px 6px;border-left:1px solid var(--line);padding-left:6px}
  .lab{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--fg);padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px}
  .lab:hover{background:var(--bg3)}
  .lab.on{background:var(--bg3);border-color:var(--line)}
  .lab .id{font-family:var(--mono);color:var(--accent2);font-size:12px}
  .lab .t{display:block;font-weight:600;margin-top:1px;font-size:13px}
  .lab .meta{color:var(--dim);font-size:11px}
  .st-done{color:var(--accent)} .st-planned{color:var(--amber)} .st-ref{color:var(--accent2)}
  main{padding:26px 34px;overflow:auto;max-width:1040px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 18px}
  .badge{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.done{color:var(--accent);border-color:#20402a;background:#0f2015}
  .badge.planned{color:var(--amber);border-color:#3a2f12;background:#20180a}
  .badge.ref{color:var(--accent2);border-color:#173154;background:#0d1d33}
  h2.title{margin:0;font-size:24px}
  section{margin:22px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg2);overflow:hidden}
  section > .h{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--bg3);border-bottom:1px solid var(--line);font-weight:700;font-size:13px;letter-spacing:.3px;text-transform:uppercase}
  section > .h .k{color:var(--accent)}
  section .body{padding:14px 16px}
  section .body p{margin:0 0 8px}
  ul.know{margin:0;padding-left:0;list-style:none}
  ul.know li{padding:6px 0 6px 22px;position:relative;border-bottom:1px dashed #222a34}
  ul.know li:last-child{border-bottom:0}
  ul.know li:before{content:"▸";position:absolute;left:4px;color:var(--accent2)}
  code{font-family:var(--mono);background:#0b1622;color:#9cdcfe;padding:1px 5px;border-radius:4px;font-size:.92em}
  .cmd{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;font-family:var(--mono);font-size:12.5px;border-top:1px solid #202833}
  .cmd:first-child{border-top:0}
  .cmd .code{flex:1;white-space:pre-wrap;word-break:break-word;color:#e6edf3}
  .cmd .code .note{color:var(--dim)}
  .cmd .code .prompt{color:var(--accent)}
  .cmd button.cp{background:var(--bg3);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;flex:none}
  .cmd button.cp:hover{color:var(--fg)}
  pre.cmd-out{margin:0;padding:9px 14px 12px 26px;background:#0b0f14;color:#9aa4ae;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;border-top:1px dashed #1b232d}
  pre.cmd-out:before{content:"↳ output";display:block;color:#4b5563;font-size:10px;letter-spacing:.5px;margin-bottom:3px}
  pre.out{margin:0;padding:14px 16px;background:#0b0f14;color:#b9c2cc;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;overflow:auto}
  .ok{color:var(--accent)} .bad{color:var(--red)} .hi{color:var(--accent2)}
  pre.tool{color:var(--amber)}
  a{color:var(--accent2)}
  .foot{color:var(--dim);font-size:11px;margin-top:30px;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <div>
    <h1>CKAD Labs — go-stock-prediction</h1>
    <div class="sub">cluster kind <b>ckad</b> · ns <b>stock</b> · reading room (không cần đọc README)</div>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>

<script>
// ===========================================================================
// DỮ LIỆU LAB — data-driven. Mỗi lab:
//   {id,title,domain,duration,status, request, knowledge[], commands[{cmd,note,out}], tool?}
// commands[].out = output THẬT của riêng lệnh đó (bỏ trống nếu chưa chạy).
// status: "done" | "planned" | "ref"
// ===========================================================================
const DATA = {
  "Day 1 — Pod design & imperative": [
    {
      id:"1.1", title:"The 60-Second Pod", domain:"App Design & Build (20%)", duration:"~45m", status:"ref",
      request:"Tạo Pod bằng lệnh (imperative) có labels + env + resources, export YAML bằng --dry-run, verify không cần mở editor (đường exam-speed).",
      knowledge:[
        "<code>kubectl run</code> tạo Pod nhanh; <code>--restart=Never</code> = Pod (không phải Deployment).",
        "<code>--dry-run=client -o yaml</code> in manifest mà KHÔNG tạo — nền tảng mọi thao tác nhanh.",
        "resources requests/limits phải thêm tay vào YAML (kubectl run không có flag đủ).",
        "Verify bằng <code>kubectl get -o wide</code> / <code>describe</code> thay vì mở editor."
      ],
      commands:[
        {cmd:"kubectl run web --image=nginx --restart=Never \\\n  --labels=app=web,tier=frontend --env=ENV=dev \\\n  --dry-run=client -o yaml > pod.yaml", note:"sinh manifest, chưa tạo", out:"# ghi ra pod.yaml — chưa tạo gì trên cluster"},
        {cmd:"kubectl apply -f pod.yaml", note:"tạo thật sau khi thêm resources", out:"pod/web created"},
        {cmd:"kubectl get pod web -o wide --show-labels", note:"verify nhanh", out:"NAME   READY   STATUS    IP           LABELS\nweb    1/1     Running   10.244.x.y   app=web,tier=frontend"}
      ]
    },
    {
      id:"1.2", title:"Init + Sidecar Pattern", domain:"App Design & Build (20%)", duration:"~60m", status:"done",
      request:"Dựng Pod nhiều container (initContainer + app + sidecar), chia data qua emptyDir, đọc log app QUA sidecar. Nhúng thẳng vào Deployment api-svc thật.",
      knowledge:[
        "initContainer chạy TUẦN TỰ tới hoàn tất, chặn app/sidecar tới khi DB sẵn sàng.",
        "app + sidecar chạy SONG SONG trong cùng Pod, trao đổi qua <code>emptyDir</code> chung.",
        "<code>securityContext.fsGroup</code> chown volume + thêm supplemental group ⇒ app non-root ghi được (image chạy uid 100/gid 101, không cần khớp 2000).",
        "<code>set -o pipefail</code> để <code>app | tee</code> vẫn trả đúng exit code (không bị tee nuốt).",
        "Đọc log 1 container: <code>kubectl logs POD -c &lt;container&gt;</code>."
      ],
      commands:[
        {cmd:"kubectl apply -f deploy/k8s/api-svc/deployment.yaml", note:"Deployment = lời giải 1.2", out:"deployment.apps/api-svc configured"},
        {cmd:"kubectl rollout status deploy/api-svc -n stock", note:"", out:"deployment \"api-svc\" successfully rolled out"},
        {cmd:"kubectl get pods -n stock -l app=api-svc", note:"chờ 2/2", out:"NAME                       READY   STATUS    RESTARTS\napi-svc-8476f74597-v8rg8   2/2     Running   0"},
        {cmd:"kubectl logs $POD -n stock -c wait-db", note:"init chờ DB", out:"waiting for db:5432 ...\ndb:5432 - accepting connections\ndb is ready"},
        {cmd:"kubectl logs $POD -n stock -c log-sidecar -f", note:"đọc log app qua sidecar", out:"HTTP server listening on 0.0.0.0:8118"}
      ]
    },
    {
      id:"1.3", title:"Jobs & CronJobs", domain:"App Design & Build (20%)", duration:"~45m", status:"done",
      request:"Job run-to-completion (backoffLimit) + CronJob theo lịch; phân biệt với Deployment. Chuyển pipeline crawl 4 market sang k8s-native (Cách 2).",
      knowledge:[
        "Job đẻ Pod (ownerReference); xóa Job ⇒ Pod bị GC theo. Pod Complete KHÔNG restart, KHÔNG xóa (giữ để xem log).",
        "<b>CronJob biết Job thành/bại qua status, KHÔNG đọc log:</b> exit code container → Pod phase → Job condition (Complete/Failed) → CronJob đọc <code>.status</code>.",
        "<code>restartPolicy: Never</code> (đẻ Pod mới khi fail) vs <code>OnFailure</code> (restart container tại chỗ). Bắt buộc, không được Always.",
        "<code>backoffLimit</code> = số retry; hết ⇒ Job Failed (reason <code>BackoffLimitExceeded</code>).",
        "CronJob = 'đồng hồ' đẻ Job đúng giờ; <code>concurrencyPolicy: Forbid</code>, <code>timeZone</code>, <code>ttlSecondsAfterFinished</code>, history limits. Cron k8s 5 trường (khác APScheduler 6).",
        "k8s-native: Pod TỰ chạy việc (<code>python -m src.jobs_cli &lt;market&gt;</code>) rồi <code>sys.exit(0/1)</code> — exit code là tín hiệu success duy nhất.",
        "Go (compiled) thì không 'chạy file' — thêm subcommand vào binary rồi build lại: <code>./api-server run-pipeline gold</code>."
      ],
      commands:[
        {cmd:"kubectl apply -f deploy/k8s/pipeline/", note:"4 CronJob (không apply job-manual)", out:"cronjob.batch/pipeline-gold created\ncronjob.batch/pipeline-crypto created\ncronjob.batch/pipeline-nasdaq created\ncronjob.batch/pipeline-sp500 created"},
        {cmd:"kubectl get cronjob -n stock", note:"SCHEDULE + TIMEZONE + SUSPEND", out:"NAME              SCHEDULE         TIMEZONE           SUSPEND   ACTIVE\npipeline-crypto   0 * * * *        Asia/Ho_Chi_Minh   False     0\npipeline-gold     0 * * * *        Asia/Ho_Chi_Minh   False     0\npipeline-nasdaq   15 * * * 1-5     Asia/Ho_Chi_Minh   False     0\npipeline-sp500    0,30 * * * 1-5   Asia/Ho_Chi_Minh   False     0"},
        {cmd:"kubectl create job verify-crypto --from=cronjob/pipeline-crypto -n stock", note:"chạy ngay, không chờ lịch", out:"job.batch/verify-crypto created"},
        {cmd:"kubectl wait --for=condition=complete job/verify-crypto -n stock --timeout=240s", note:"", out:"job.batch/verify-crypto condition met"},
        {cmd:"kubectl logs -n stock -l job-name=verify-crypto", note:"pipeline TỰ chạy trong pod", out:"jobs_cli.start market=crypto\ncrypto.crawl.done errors=0 saved=3\npipeline.crawl.done market=CRYPTO saved=3\npredict.crypto.start algorithms=13 coins=3\nsim.live_step.market_start bots=146 market=CRYPTO\npipeline.reconcile.done market=CRYPTO scored=0\ncrypto.intraday.done saved=49\njobs_cli.done market=crypto        → exit 0"},
        {cmd:"kubectl get job verify-crypto -n stock", note:"trạng thái Job", out:"NAME            STATUS     COMPLETIONS   DURATION\nverify-crypto   Complete   1/1           32s"},
        {cmd:"# demo RETRY: Job cố tình exit 1 (backoffLimit=2)\nkubectl get job fail-demo -n stock", note:"đẻ 3 Pod Error rồi Failed", out:"NAME        STATUS   COMPLETIONS\nfail-demo   Failed   0/1\n# 3 Pod Error (1 + 2 retry) · condition Failed\n# reason=BackoffLimitExceeded · failed=3 · exitCode=1"},
        {cmd:"kubectl apply -f deploy/k8s/pipeline/job-manual.yaml", note:"chạy tay; tự xóa sau 5' (ttl 300s)", out:"job.batch/pipeline-manual created"}
      ]
    },
    {
      id:"1.4", title:"Label & Annotation Drill", domain:"App Design & Build (20%)", duration:"~30m", status:"done",
      request:"Gán/sửa label hàng loạt, query bằng selector, dùng --overwrite. Thực hành thẳng trên ns stock (Pod nháp demo-*), cuối roll back.",
      knowledge:[
        "<b>Label</b> = định danh để CHỌN (Service→Pod, RS→Pod, Job→Pod), query được <code>-l</code>. <b>Annotation</b> = metadata để ĐỌC, KHÔNG selector được — nhưng KHÔNG phải ghi chú suông: <code>last-applied-configuration</code> (apply merge), <code>deployment.kubernetes.io/revision</code> (rollout undo), ingress/prometheus/cert-manager đều đọc annotation.",
        "Selector: equality <code>app=web</code>, <code>tier!=x</code>; set-based <code>'env in (prod)'</code>; tồn tại <code>'!release'</code>; AND <code>'a=1,b=2'</code>.",
        "<code>-L app,tier</code> (hoa) = hiện label thành CỘT; <code>--show-labels</code> = xem hết.",
        "Sửa label đã tồn tại BẮT BUỘC <code>--overwrite</code> (thiếu ⇒ lỗi 'already has a value'). Xóa bằng hậu tố <code>key-</code>.",
        "⚠️ <code>.spec.selector</code> của Deployment/StatefulSet là IMMUTABLE.",
        "Kỹ thuật: đổi label <code>app=</code> của 1 Pod ⇒ tách khỏi RS ⇒ RS đẻ Pod mới bù; Pod tách vẫn sống để debug."
      ],
      commands:[
        {cmd:"kubectl run demo-web --image=api-svc:dev -n stock \\\n  --labels=app=demo,tier=frontend,env=dev --command -- sleep 3600", note:"Pod nháp trong stock", out:"pod/demo-web created"},
        {cmd:"kubectl get pods -n stock -l app=demo -L tier,env", note:"label thành cột", out:"NAME       READY   STATUS    TIER       ENV\ndemo-api   1/1     Running   backend    prod\ndemo-web   1/1     Running   frontend   dev"},
        {cmd:"kubectl get pods -n stock -l 'app=demo,env in (prod)'", note:"set-based + AND", out:"NAME       READY   STATUS\ndemo-api   1/1     Running"},
        {cmd:"kubectl label pod demo-web tier=backend -n stock", note:"thiếu --overwrite ⇒ LỖI", out:"error: 'tier' already has a value (frontend), and --overwrite is false"},
        {cmd:"kubectl label pod demo-web tier=backend --overwrite -n stock", note:"sửa đúng", out:"pod/demo-web labeled"},
        {cmd:"kubectl label pod demo-web release- -n stock", note:"xóa label (hậu tố -)", out:"pod/demo-web unlabeled"},
        {cmd:"kubectl annotate pod demo-web owner=team-x -n stock", note:"annotation", out:"pod/demo-web annotated"},
        {cmd:"# tách 1 Pod khỏi ReplicaSet\nkubectl label pod $V app=quarantine --overwrite -n stock", note:"RS đẻ Pod mới bù", out:"app=demo-dep  count=3  (RS đẻ bù 1 Pod mới)\napp=quarantine count=1  (Pod tách, vẫn Running)"},
        {cmd:"kubectl delete deploy demo-dep -n stock\nkubectl delete pod -n stock -l 'app in (demo,quarantine)'", note:"ROLL BACK — đồ thật giữ nguyên", out:"deployment \"demo-dep\" deleted\npod \"demo-web\" / \"demo-api\" / \"...quarantine\" deleted"}
      ]
    }
  ],

  "Day 2 — Deployments & rollouts": [
    {
      id:"2.1", title:"Rolling Update & Rollback", domain:"App Deployment (20%)", duration:"~45m", status:"planned",
      request:"Rolling update v1→v2, monitor rollout, rollback sau khi giả lập bản lỗi. Chứng minh KHÔNG rớt request khi update.",
      knowledge:[
        "Deployment strategy <code>RollingUpdate</code> với <code>maxSurge</code>/<code>maxUnavailable</code> điều khiển nhịp thay pod.",
        "<code>kubectl rollout status/history/undo</code>; <code>--to-revision=N</code>; annotation <code>kubernetes.io/change-cause</code> hiện ở history.",
        "Mỗi thay đổi <code>.spec.template</code> ⇒ ReplicaSet mới; RS cũ giữ lại (revision) để undo.",
        "Zero-downtime cần <code>readinessProbe</code> + <code>maxUnavailable</code> hợp lý — nếu không, request rớt khi pod mới chưa Ready."
      ],
      commands:[
        {cmd:"kubectl set image deploy/web web=nginx:1.27 -n stock", note:"trigger rolling update"},
        {cmd:"kubectl rollout status deploy/web -n stock", note:"theo dõi"},
        {cmd:"kubectl rollout history deploy/web -n stock", note:"xem revision"},
        {cmd:"kubectl rollout undo deploy/web -n stock", note:"rollback"}
      ],
      tool:"./e2e-test.sh zero-downtime web 80 web nginx:1.27 /   # bắn traffic lúc update, đếm OK/FAIL\n./e2e-test.sh rollback web                                 # undo + history"
    },
    {
      id:"2.2", title:"Blue/Green Switch", domain:"App Deployment (20%)", duration:"~45m", status:"planned",
      request:"Chạy 2 Deployment (blue & green), lật traffic bằng cách đổi selector của MỘT Service.",
      knowledge:[
        "Service route theo <code>selector</code>; đổi selector ⇒ endpoints trỏ pod set khác NGAY (switch tức thời).",
        "Blue/green = 2 bản chạy song song (label <code>color: blue|green</code>), Service chọn 1 màu.",
        "Khác rolling update: không thay pod tại chỗ, mà lật hẳn sang bộ pod mới đã sẵn sàng.",
        "Verify bằng <code>kubectl get endpoints</code> — thấy IP pod đổi sang màu mới."
      ],
      commands:[
        {cmd:"kubectl patch svc web -n stock -p '{\"spec\":{\"selector\":{\"app\":\"web\",\"color\":\"green\"}}}'", note:"lật sang green"},
        {cmd:"kubectl get endpoints web -n stock -o wide", note:"xác nhận IP đổi"}
      ],
      tool:"./e2e-test.sh bluegreen web color green   # lật selector + in endpoints trước/sau"
    },
    {
      id:"2.3", title:"Scale & HPA", domain:"App Deployment (20%)", duration:"~45m", status:"planned",
      request:"Scale tay lên 10 replica; cấu hình HPA target 50% CPU; sinh tải để thấy HPA scale up rồi scale down.",
      knowledge:[
        "<code>kubectl scale deploy/web --replicas=10</code> — scale thủ công.",
        "HPA cần <code>resources.requests.cpu</code> trên container (tính % theo request) VÀ <b>metrics-server</b>.",
        "⚠️ kind KHÔNG có metrics-server sẵn — phải cài trước (kèm <code>--kubelet-insecure-tls</code>).",
        "HPA poll metrics ~15s; scale up nhanh, scale down có cooldown (stabilization window).",
        "Cần TẢI thật để CPU vượt ngưỡng — đó là việc của harness loadgen."
      ],
      commands:[
        {cmd:"kubectl scale deploy/web --replicas=10 -n stock", note:"scale tay"},
        {cmd:"kubectl autoscale deploy/web --min=2 --max=10 --cpu-percent=50 -n stock", note:"tạo HPA"},
        {cmd:"kubectl get hpa web -n stock -w", note:"theo dõi REPLICAS/TARGETS"}
      ],
      tool:"# tab 1: sinh tải 20 luồng x 120s\n./e2e-test.sh loadgen web 80 20 120 /\n# tab 2: xem HPA scale\n./e2e-test.sh watch-hpa web"
    },
    {
      id:"2.4", title:"Kustomize Overlay", domain:"App Deployment (20%)", duration:"~45m", status:"planned",
      request:"Cấu trúc base + overlay; patch image tag và số replica cho môi trường mà không nhân đôi manifest.",
      knowledge:[
        "<code>kustomization.yaml</code>: base chứa manifest gốc, overlay <code>patchesStrategicMerge</code>/<code>images</code>/<code>replicas</code>.",
        "<code>kubectl kustomize overlays/prod</code> render ra YAML cuối; <code>kubectl apply -k</code> apply thẳng.",
        "DRY: đổi image/replica theo môi trường bằng patch, không copy cả file.",
        "Liên hệ: có thể dùng để tách 'production sạch' vs 'bài lab' của các Deployment trong repo này."
      ],
      commands:[
        {cmd:"kubectl kustomize deploy/k8s/overlays/prod", note:"xem YAML render"},
        {cmd:"kubectl apply -k deploy/k8s/overlays/prod", note:"apply overlay"}
      ],
      tool:"# kiểm tra render khớp mong đợi trước khi apply:\nkubectl kustomize deploy/k8s/overlays/prod | grep -E 'image:|replicas:'"
    }
  ]
};

// ===========================================================================
// RENDER
// ===========================================================================
const $ = s => document.querySelector(s);
const days = Object.keys(DATA);
let curDay = days[0], curLab = 0;
const open = {};   // day -> bool (mặc định mở)

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hiOut(s){
  return esc(s)
    .replace(/\b(Complete|Running|created|configured|labeled|annotated|PASS|ready=true|exit 0|successfully rolled out|condition met)\b/g,'<span class="ok">$1</span>')
    .replace(/\b(Error|Failed|FAIL|error|deleted|unlabeled|BackoffLimitExceeded|exitCode=1)\b/g,'<span class="bad">$1</span>');
}

function renderNav(){
  $("#nav").innerHTML = days.map(d=>{
    const isOpen = open[d]!==false;
    const labs = DATA[d].map((l,i)=>`
      <button class="lab ${(d===curDay&&i===curLab)?'on':''}" data-day="${d}" data-i="${i}">
        <span class="id">${l.id}</span>
        <span class="t">${l.title}</span>
        <span class="meta">${l.duration} · <span class="st-${l.status}">${l.status.toUpperCase()}</span></span>
      </button>`).join("");
    return `<div class="day-group">
        <div class="day" data-day="${d}"><span class="caret">${isOpen?'▾':'▸'}</span> ${d}</div>
        <div class="day-labs ${isOpen?'':'collapsed'}">${labs}</div>
      </div>`;
  }).join("");
  document.querySelectorAll('#nav .day').forEach(h=>h.onclick=()=>{
    const d=h.dataset.day; open[d] = !(open[d]!==false); renderNav();
  });
  document.querySelectorAll('#nav .lab').forEach(b=>b.onclick=()=>{
    curDay=b.dataset.day; curLab=+b.dataset.i; renderNav(); renderMain();
  });
}

function cmdBlock(cmds){
  return cmds.map((c,i)=>{
    const noteHtml = c.note ? `  <span class="note"># ${esc(c.note)}</span>` : "";
    const outHtml = c.out ? `<pre class="cmd-out">${hiOut(c.out)}</pre>` : "";
    return `<div class="cmd">
        <div class="code"><span class="prompt">$</span> ${esc(c.cmd)}${noteHtml}</div>
        <button class="cp" data-i="${i}">copy</button>
      </div>${outHtml}`;
  }).join("");
}

function renderMain(){
  const l = DATA[curDay][curLab];
  const toolHtml = l.tool
      ? `<section><div class="h"><span class="k">⚙</span> Tool test (giả lập end-to-end)</div>
           <pre class="out tool">${esc(l.tool)}</pre></section>` : "";
  $("#main").innerHTML = `
    <h2 class="title">${l.id} · ${l.title}</h2>
    <div class="badges">
      <span class="badge ${l.status}">${l.status.toUpperCase()}</span>
      <span class="badge">${l.domain}</span>
      <span class="badge">${l.duration}</span>
    </div>
    <section><div class="h"><span class="k">◎</span> Request — yêu cầu</div>
      <div class="body"><p>${esc(l.request)}</p></div></section>
    <section><div class="h"><span class="k">✦</span> Kiến thức cần biết</div>
      <div class="body"><ul class="know">${l.knowledge.map(k=>`<li>${k}</li>`).join("")}</ul></div></section>
    <section><div class="h"><span class="k">$</span> Lệnh execute + output từng lệnh</div>
      <div class="cmds">${cmdBlock(l.commands)}</div></section>
    ${toolHtml}
    <div class="foot">CKAD labs · nguồn: deploy/k8s/ckad-labs/day_*/lab.md · harness: day_2/e2e-test.sh</div>`;
  document.querySelectorAll("#main .cp").forEach(btn=>btn.onclick=()=>{
    const raw = DATA[curDay][curLab].commands[+btn.dataset.i].cmd.replace(/\\\n\s*/g," ");
    navigator.clipboard.writeText(raw).then(()=>{btn.textContent="copied";setTimeout(()=>btn.textContent="copy",1200);});
  });
}

renderNav();
renderMain();
</script>
</body>
</html>
