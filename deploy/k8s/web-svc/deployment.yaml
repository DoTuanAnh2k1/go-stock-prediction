# =============================================================================
# web-svc — React + Vite build, phục vụ static qua Nginx (:3000).
#
# Build & load image:
#   docker build -t web-svc:dev -f deploy/web-svc.Dockerfile web-svc
#   kind load docker-image web-svc:dev --name ckad
#
# Không cần env (gọi API tương đối qua gateway). Truy cập qua gateway-svc, không expose trực tiếp.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc
  namespace: stock
  labels: { app: web-svc }
spec:
  replicas: 3                    # ≥2 để rolling update zero-downtime (Lab 2.1)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # không bao giờ giảm dưới số replica mong muốn
  selector:
    matchLabels: { app: web-svc }
  template:
    metadata:
      labels: { app: web-svc }
    spec:
      containers:
        - name: web-svc
          image: web-svc:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }   # Service chỉ route pod đã sẵn sàng
            initialDelaySeconds: 2
            periodSeconds: 3
          # preStop: giữ pod phục vụ thêm 5s trong lúc bị gỡ khỏi Endpoints -> tránh
          # termination race, zero-dropped-connection khi rolling update.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
