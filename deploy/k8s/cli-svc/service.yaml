# =============================================================================
# cli-svc — NodePort SSH :2345 (expose trực tiếp, KHÔNG qua gateway).
#   ssh -p <nodePort> user@<node-ip>   (hoặc port-forward)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: cli-svc
  namespace: stock
spec:
  type: NodePort
  selector: { app: cli-svc }
  ports:
    # targetPort → ambassador nginx stream (:12345) → proxy_pass app SSH :2345.
    # Service port + nodePort giữ nguyên nên client SSH không đổi.
    - port: 2345
      targetPort: 12345
      nodePort: 32345
