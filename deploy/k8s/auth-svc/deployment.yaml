# =============================================================================
# auth-svc — Java Spring Boot 3, gRPC :8120. Auth/RBAC + Flyway V1–V3.
# Seeds chon/super_admin lúc khởi động.
#
# Build & load image:
#   docker build -t auth-svc:dev -f deploy/auth-svc.Dockerfile auth-svc
#   kind load docker-image auth-svc:dev --name ckad
#
# Yêu cầu: DB Ready trước (Flyway migrate lúc boot).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: stock
  labels: { app: auth-svc }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-svc }
  template:
    metadata:
      labels: { app: auth-svc }
      # ---- Prometheus scrape (factor 14 metrics) — Actuator/Prometheus trên :9464 ----
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # ---- initContainer wait-db: chờ DB Ready (pg_isready) rồi Flyway/app mới start ----
      # Giống api-svc, nhưng image auth-svc (Java) không có pg_isready nên dùng image
      # timescaledb (đã có sẵn trong cluster vì db dùng chung) chỉ để chạy pg_isready.
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for db:5432 ..."
              until pg_isready -h db -p 5432 -U postgres; do
                echo "db not ready, retry in 2s"; sleep 2
              done
              echo "db is ready"
      containers:
        - name: auth-svc
          image: auth-svc:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8120
            - name: mgmt              # Actuator HTTP: /metrics + health probes
              containerPort: 9464
          envFrom:
            - configMapRef: { name: auth-config }
            - secretRef:    { name: auth-secret }
          # ---- Health probes (factor 14) — Actuator health groups trên :9464 ----
          # readiness = /actuator/health/readiness; liveness = /actuator/health/liveness.
          # Đơn giản & chuẩn hơn gRPC probe cho Spring; JVM boot chậm nên startupProbe nới thời gian.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 9464 }
            failureThreshold: 30
            periodSeconds: 5          # tối đa ~150s cho JVM + Flyway migrate lúc boot
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9464 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9464 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }   # JVM
