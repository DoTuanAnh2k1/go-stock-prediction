# =============================================================================
# auth-svc — Java Spring Boot 3, gRPC :8120. Auth/RBAC + Flyway V1–V3.
# Seeds chon/super_admin lúc khởi động.
#
# Build & load image:
#   docker build -t auth-svc:dev -f deploy/auth-svc.Dockerfile auth-svc
#   kind load docker-image auth-svc:dev --name ckad
#
# Multi-container pod (pattern 4-container — CKAD):
#   init  wait-db     — chờ DB Ready (Flyway migrate lúc boot).
#   app   auth-svc    — Spring Boot gRPC :8120; tee log ra /var/log/app cho sidecar.
#   amb   nginx       — ambassador gRPC :18120 → localhost:8120 (Service grpc trỏ vào đây).
#   side  log-sidecar — tail -f log app qua emptyDir chung.
# Metrics/Actuator :9464 KHÔNG qua nginx (Prometheus scrape thẳng).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-svc-nginx
  namespace: stock
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      server {
        listen 18120;
        http2 on;
        location / {
          grpc_pass grpc://127.0.0.1:8120;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: stock
  labels: { app: auth-svc }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-svc }
  template:
    metadata:
      labels: { app: auth-svc }
      # ---- Prometheus scrape (factor 14 metrics) — Actuator/Prometheus trên :9464 ----
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # ---- initContainer wait-db: chờ DB Ready (pg_isready) rồi Flyway/app mới start ----
      # image auth-svc (Java) không có pg_isready nên dùng image timescaledb (đã có sẵn).
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for db:5432 ..."
              until pg_isready -h db -p 5432 -U postgres; do
                echo "db not ready, retry in 2s"; sleep 2
              done
              echo "db is ready"
      containers:
        # ---- App: Spring Boot gRPC :8120; tee log (JAVA_TOOL_OPTIONS agent otel vẫn tự áp) ----
        - name: auth-svc
          image: auth-svc:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "set -o pipefail; java -jar /app/app.jar 2>&1 | tee /var/log/app/auth.log"]
          ports:
            - name: grpc
              containerPort: 8120
            - name: mgmt              # Actuator HTTP: /metrics + health probes
              containerPort: 9464
          envFrom:
            - configMapRef: { name: auth-config }
            - secretRef:    { name: auth-secret }
          # ---- Health probes (factor 14) — Actuator health groups trên :9464 (trỏ THẲNG app) ----
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 9464 }
            failureThreshold: 30
            periodSeconds: 5          # tối đa ~150s cho JVM + Flyway migrate lúc boot
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9464 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9464 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }   # JVM
        # ---- Ambassador nginx: reverse-proxy gRPC :18120 → localhost:8120 ----
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc-proxy, containerPort: 18120 }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
        # ---- Sidecar: xem log app qua emptyDir chung ----
        - name: log-sidecar
          image: auth-svc:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until [ -f /var/log/app/auth.log ]; do sleep 1; done; tail -f /var/log/app/auth.log"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "64Mi" }
      volumes:
        - name: logs
          emptyDir: {}                 # chia sẻ giữa app "auth-svc" và "log-sidecar"
        - name: nginx-conf
          configMap: { name: auth-svc-nginx }
