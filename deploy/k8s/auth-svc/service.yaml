# =============================================================================
# auth-svc — ClusterIP gRPC :8120 (api-svc gọi qua AUTH_GRPC_TARGET).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: stock
spec:
  selector: { app: auth-svc }
  ports:
    - name: grpc
      port: 8120
      targetPort: 8120
    - name: mgmt              # Actuator HTTP: /actuator/prometheus + /actuator/health
      port: 9464
      targetPort: 9464
