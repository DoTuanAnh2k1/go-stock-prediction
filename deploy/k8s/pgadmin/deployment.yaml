# =============================================================================
# pgadmin — PostgreSQL web UI (dpage/pgadmin4). Public image, không cần kind load.
# Truy cập qua port-forward:
#   kubectl port-forward -n stock svc/pgadmin 8081:80
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: stock
  labels: { app: pgadmin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pgadmin }
  template:
    metadata:
      labels: { app: pgadmin }
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef: { name: pgadmin-config }
            - secretRef:    { name: pgadmin-secret }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "384Mi" }
