# =============================================================================
# api-svc — env KHÔNG nhạy cảm (cấu hình chung). Cặp với secret.yaml.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: stock
data:
  SERVER_PORT: "8118"
  DB_DRIVER: postgresql
  POSTGRES_HOST: "db"            # = tên Service DB
  POSTGRES_PORT: "5432"
  POSTGRES_DB: go_stock_prediction
  POSTGRES_USER: postgres
  GRPC_TARGET: "prediction-svc:8119"
  AUTH_GRPC_TARGET: "auth-svc:8120"
  SERVICE_MGT_ENABLED: "false"
  LOG_LEVEL: INFO
  DB_LOG_LEVEL: WARN
  ADMIN_USERNAME: admin
  BACKUP_DIR: /backups
  DOCS_ROOT: /repo
  ALLOWED_ORIGINS: "https://localhost"
