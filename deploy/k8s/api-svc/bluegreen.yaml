---
apiVersion: v1
kind: Service
metadata:
  name: api-svc-blue
  namespace: stock
  labels: { app: api-svc, color: blue }
spec:
  selector: { app: api-svc, color: blue }
  # targetPort → ambassador nginx (:18118) → proxy_pass app :8118.
  ports: [{ port: 8118, targetPort: 18118 }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc-green
  namespace: stock
  labels: { app: api-svc, color: green }
spec:
  selector: { app: api-svc, color: green }
  ports: [{ port: 8118, targetPort: 18118 }]
