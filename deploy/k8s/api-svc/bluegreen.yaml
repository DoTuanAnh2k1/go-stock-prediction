          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U postgres; do echo 'db not ready'; sleep 2; done"]
      containers:
        - name: api-svc
          image: api-svc:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8118 }]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef:    { name: api-secret }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8118 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/simple, port: 8118 }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
