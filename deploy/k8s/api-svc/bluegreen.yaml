# =============================================================================
# api-svc blue/green — 2 Deployment + 2 Service (per màu). Gateway route "/api"
# tới màu active. 2 màu chung DB (api-svc không migration → an toàn). container
# name = "api-svc". initContainer wait-db chờ DB Ready trước khi connect.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-svc-blue
  namespace: stock
  labels: { app: api-svc, color: blue }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: api-svc, color: blue }
  template:
    metadata:
      labels: { app: api-svc, color: blue }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8118"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U postgres; do echo 'db not ready'; sleep 2; done"]
      containers:
        - name: api-svc
          image: api-svc:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8118 }]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef:    { name: api-secret }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8118 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/simple, port: 8118 }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - { name: backups, mountPath: /backups }
            - { name: repo, mountPath: /repo }
      volumes:
        - { name: backups, emptyDir: {} }
        - { name: repo, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-svc-green
  namespace: stock
  labels: { app: api-svc, color: green }
spec:
