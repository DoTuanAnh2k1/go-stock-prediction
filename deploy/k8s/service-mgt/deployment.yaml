# =============================================================================
# service-mgt — Go registry/discovery gRPC :8121.
#
# Build & load image:
#   docker build -t service-mgt:dev -f deploy/service-mgt.Dockerfile service-mgt
#   kind load docker-image service-mgt:dev --name ckad
#
# Yêu cầu: DB Ready trước (write-through Postgres).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-mgt
  namespace: stock
  labels: { app: service-mgt }
spec:
  replicas: 1
  selector:
    matchLabels: { app: service-mgt }
  template:
    metadata:
      labels: { app: service-mgt }
      # Metrics live on the auxiliary HTTP port 9464 (service is gRPC-only).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      # ---- initContainer wait-db: chờ DB Ready (pg_isready) rồi write-through mới chạy ----
      # Giống api-svc, nhưng image service-mgt (Go) không có pg_isready nên dùng image
      # timescaledb (đã có sẵn trong cluster vì db dùng chung) chỉ để chạy pg_isready.
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for db:5432 ..."
              until pg_isready -h db -p 5432 -U postgres; do
                echo "db not ready, retry in 2s"; sleep 2
              done
              echo "db is ready"
      containers:
        - name: service-mgt
          image: service-mgt:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: 8121 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: service-mgt-config }
            - secretRef:    { name: service-mgt-secret }
          # Native gRPC health probes (k8s ≥1.24). The gRPC server responds on
          # :8121; the kubelet dials the standard grpc.health.v1 service.
          readinessProbe:
            grpc: { port: 8121 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc: { port: 8121 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
