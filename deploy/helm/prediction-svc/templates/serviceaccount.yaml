# =============================================================================
# prediction-svc — ServiceAccount riêng (CKAD 3.3). automountServiceAccountToken:
# false vì prediction-svc KHÔNG gọi Kubernetes API. Deployment hard-ref
# serviceAccountName: prediction-svc nên SA này tạo VÔ ĐIỀU KIỆN
# (trước đây ở umbrella serviceaccounts.yaml).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prediction-svc
  namespace: {{ .Release.Namespace }}
  labels: { app: prediction-svc }
automountServiceAccountToken: false
