# =============================================================================
# cronjobs — super-admin credentials used by the simulation CronJob to log in
# (/api/x/grant) and trigger simulation-live-step. Provided via -f values-secret.yaml;
# no weak defaults committed. MUST match auth-svc's seeded super_admin.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cronjobs-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  SUPER_ADMIN_USERNAME: {{ required "cronjobs: secrets.superAdminUsername is required (provide via -f values-secret.yaml)" .Values.secrets.superAdminUsername | quote }}
  SUPER_ADMIN_PASSWORD: {{ required "cronjobs: secrets.superAdminPassword is required (provide via -f values-secret.yaml)" .Values.secrets.superAdminPassword | quote }}
