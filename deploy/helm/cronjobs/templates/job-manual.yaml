{{- if .Values.manualJob.enabled }}
# =============================================================================
# Job THỦ CÔNG — Cách 2 (k8s-native). Chạy pipeline 1 market NGAY khi apply.
# KHÔNG apply cùng lúc với các CronJob (file này để chạy tay khi cần).
#
# Đổi market: sửa đối số cuối trong command (gold|nasdaq|crypto|sp500).
#
# Chạy:     kubectl apply -f deploy/k8s/pipeline/job-manual.yaml
# Xem log:  kubectl logs -n stock -l job-name=pipeline-manual -f
# Chạy lại: ttlSecondsAfterFinished tự xóa sau 5' -> apply lại được; hoặc xóa tay:
#           kubectl delete job pipeline-manual -n stock
#
# Cách nhanh khác (không cần file này) — tạo Job tức thời TỪ CronJob:
#   kubectl create job manual-gold --from=cronjob/pipeline-gold -n stock
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-manual
  namespace: {{ .Release.Namespace }}
  labels: { app: pipeline, run: manual }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: { app: pipeline }
    spec:
      restartPolicy: Never
      # dnsConfig ndots:1 — bỏ search-domain rác để tránh DNS hijack NXDOMAIN của
      # mạng hotspot/ISP (xem cronjob-*.yaml). Không có dòng này thì crawl timeout saved=0.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # initContainer wait-db: chờ DB Ready trước khi pipeline connect (như api-svc).
      # Image timescaledb (đã có sẵn trong cluster) vì prediction-svc không có pg_isready.
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for db:5432 ..."
              until pg_isready -h db -p 5432 -U postgres; do
                echo "db not ready, retry in 2s"; sleep 2
              done
              echo "db is ready"
      containers:
        - name: pipeline
          image: "{{ .Values.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.jobs_cli", "gold"]   # <-- ĐỔI MARKET Ở ĐÂY
          envFrom:
            - configMapRef: { name: prediction-config }
            - secretRef:    { name: prediction-secret }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1500m", memory: "2Gi" }
{{- end }}
