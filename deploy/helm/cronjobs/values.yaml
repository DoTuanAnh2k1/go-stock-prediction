# =============================================================================
# cronjobs — batch pipeline (jobs_cli) + db backup. Self-contained values.
# Image = prediction-svc (chạy `python -m src.jobs_cli <job>`); imageTag khớp với
# imageTag của chart prediction-svc để pipeline dùng đúng bản đã deploy.
# =============================================================================
imageTag: "1.0.0"            # release tag; CI overrides: --set imageTag=$(git rev-parse --short HEAD)
image: prediction-svc

# super-admin creds for the simulation CronJob's /api/x/grant login.
# Provided via -f values-secret.yaml (no weak defaults); MUST match auth-svc's super_admin.
secrets:
  superAdminUsername: ""
  superAdminPassword: ""

# job-manual.yaml — Job chạy tay 1 market ngay khi cài. Default OFF; bật:
#   --set manualJob.enabled=true
manualJob:
  enabled: false
