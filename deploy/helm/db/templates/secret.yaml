# =============================================================================
# db — creds cho TimescaleDB/Postgres. envFrom secretRef trong statefulset.yaml.
# All values are required — provide via -f values-secret.yaml (see
# deploy/helm/db/values-secret.yaml.example). Empty defaults in values.yaml
# exist only to make `helm template` renderable for linting; the required
# guards below will fail a real helm upgrade if any value is missing.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "db: secrets.postgresUser is required (provide via -f values-secret.yaml)" .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "db: secrets.postgresPassword is required (provide via -f values-secret.yaml)" .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ required "db: secrets.postgresDb is required (provide via -f values-secret.yaml)" .Values.secrets.postgresDb | quote }}
  # Per-role passwords — consumed by 00-init-databases.sh via envFrom on the db pod
  AUTH_DB_PASSWORD: {{ required "db: secrets.authDbPassword is required (provide via -f values-secret.yaml)" .Values.secrets.authDbPassword | quote }}
  MARKET_DB_PASSWORD: {{ required "db: secrets.marketDbPassword is required (provide via -f values-secret.yaml)" .Values.secrets.marketDbPassword | quote }}
  REGISTRY_DB_PASSWORD: {{ required "db: secrets.registryDbPassword is required (provide via -f values-secret.yaml)" .Values.secrets.registryDbPassword | quote }}
  API_DB_PASSWORD: {{ required "db: secrets.apiDbPassword is required (provide via -f values-secret.yaml)" .Values.secrets.apiDbPassword | quote }}
