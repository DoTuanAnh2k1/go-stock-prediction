# =============================================================================
# db — TimescaleDB (PostgreSQL 16) dưới dạng StatefulSet.
# PVC sinh tự động từ volumeClaimTemplates (data-db-0) — KHÔNG khai báo PVC rời.
#
# Schema init: hai ConfigMap được tạo ngoài Helm (idempotent) bởi scripts/deploy.sh:
#   - db-init    (from deploy/db-init/00-init-databases.sh, defaultMode 0755)
#                Mounted at /docker-entrypoint-initdb.d — creates roles + databases.
#   - db-schemas (from deploy/db-init/schemas/*.sql)
#                Mounted at /schemas — sourced by 00-init-databases.sh during init.
#
# The 4 per-role passwords (AUTH_DB_PASSWORD, MARKET_DB_PASSWORD,
# REGISTRY_DB_PASSWORD, API_DB_PASSWORD) are injected via envFrom secretRef
# db-secret (same Secret as POSTGRES_USER/PASSWORD/DB) — no separate env block.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: db            # trỏ tới Headless Service (db/service.yaml)
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: db
          image: timescale/timescaledb:latest-pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: db-secret }   # POSTGRES_USER/PASSWORD/DB + *_DB_PASSWORD role creds
          env:
            - name: PGTZ
              value: Asia/Ho_Chi_Minh
            # PGDATA để subdir con: PVC mount thẳng /var/lib/postgresql/data đôi khi
            # vướng lost+found khiến initdb báo "not empty" — trỏ vào subdir cho chắc.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
            - name: db-schemas
              mountPath: /schemas
      volumes:
        - name: db-init
          configMap:
            name: db-init
            defaultMode: 0755    # 00-init-databases.sh must be executable
        - name: db-schemas
          configMap:
            name: db-schemas     # contains 10-market_db.sql, 20-registry_db.sql
  # volumeClaimTemplates: STS tự tạo 1 PVC riêng cho mỗi pod (data-db-0).
  # Đây là điểm khác cốt lõi so với Deployment.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        # storageClassName bỏ trống => dùng StorageClass mặc định của kind (standard)
