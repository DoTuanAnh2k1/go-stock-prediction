# =============================================================================
# api-svc — ClusterIP Service, expose :8118 trong cluster.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: {{ .Release.Namespace }}
spec:
  # Blue/green KINH ĐIỂN: khi bluegreen bật, selector kèm color=<activeColor> → Service CHUNG
  # trỏ đúng 1 màu (KHÔNG hit cả 2). Cutover = FLIP color (helm --set global.bluegreen.activeColor
  # hoặc kubectl patch selector); rollback = flip lại. Single mode: chỉ {app} (pod không có color).
  # Dùng bởi /health của gateway + Ingress (Lab 4.2) → cả hai nay tôn trọng màu active.
  selector:
    app: api-svc
    {{- if .Values.global.bluegreen.enabled }}
    color: {{ .Values.global.bluegreen.activeColor }}
    {{- end }}
  ports:
    # targetPort → ambassador nginx (:18118) → proxy_pass app :8118.
    - port: 8118
      targetPort: 18118
