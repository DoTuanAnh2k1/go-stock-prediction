# =============================================================================
# api-svc — env NHẠY CẢM (mật khẩu / JWT). Cặp với configmap.yaml.
# stringData: k8s tự base64-encode khi lưu (đọc lại sẽ là base64 trong data).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.global.secrets.postgresPassword | quote }}
  ADMIN_PASSWORD: {{ .Values.global.secrets.adminPassword | quote }}
  JWT_SECRET: {{ .Values.global.secrets.jwtSecret | quote }}
  INTERNAL_SECRET: {{ .Values.global.secrets.internalSecret | quote }}
