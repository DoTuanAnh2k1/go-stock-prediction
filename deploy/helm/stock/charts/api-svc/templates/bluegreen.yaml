{{- if .Values.global.bluegreen.enabled }}
# =============================================================================
# api-svc blue/green — 2 Deployment + 2 Service (per màu). Gateway route "/api"
# tới Service màu active (backend: http://api-svc-<color>:8118). 2 màu chung DB
# (api-svc không migration → an toàn).
#
# Blue và green GIỐNG HỆT nhau trừ nhãn `color` → sinh bằng `range list blue green`
# (1 body, không copy-paste 2 lần). Boilerplate ambassador/sidecar/HA gom vào
# library chart charts/common (_ambassador.tpl).
#
# Multi-container pod (pattern 4-container — CKAD), áp cho CẢ hai màu:
#   init  wait-db     — chờ DB Ready (pg_isready). (one-liner inline, giữ nguyên bản gốc)
#   app   api-svc     — HTTP :8118; tee log ra /var/log/app cho sidecar.
#   amb   nginx       — ambassador :18118 → localhost:8118 (proxy_buffering off cho SSE).
#   side  log-sidecar — tail -f log app qua emptyDir chung.
# Service api-svc-<color> targetPort → 18118 nên gateway đi XUYÊN nginx.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-svc-nginx
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      server {
        listen 18118;
        location / {
          proxy_pass http://127.0.0.1:8118;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Connection "";
          # SSE (/api/pipeline/stream): stream ngay, không buffer
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 3600s;
        }
      }
    }
{{- range $color := list "blue" "green" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-svc-{{ $color }}
  namespace: {{ $.Release.Namespace }}
  labels: { app: api-svc, color: {{ $color }} }
spec:
  {{- if not $.Values.global.hpa.enabled }}
  replicas: 2                        # CKAD 2.3: HPA off → giữ 2. HPA on → HPA sở hữu replicas (omit)
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: api-svc, color: {{ $color }} }
  template:
    metadata:
      labels: { app: api-svc, color: {{ $color }} }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8118"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-svc           # CKAD 3.3 — SA riêng (automount:false, không gọi API)
      tolerations:                          # HA: chạy được trên node control-plane (dùng cả 3 node)
        {{- include "stock.tolerations" $ | nindent 8 }}
      topologySpreadConstraints:            # HA: rải pod đều các node (spread theo app, không theo màu)
        {{- include "stock.topologySpread" "api-svc" | nindent 8 }}
      # fsGroup: app chạy USER appuser (non-root) → ghi được emptyDir "logs".
      # seccompProfile RuntimeDefault (CKAD 3.2) cho mọi container ở cả 2 màu.
      securityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          securityContext:              # CKAD 3.2 — init pg_isready: drop ALL caps + no priv-esc
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U postgres; do echo 'db not ready'; sleep 2; done"]
      containers:
        - name: api-svc
          image: "{{ $.Values.global.images.apiSvc }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          # CKAD 3.2 — drop ALL caps + no priv-esc. USER appuser (alpine `-S`, non-numeric UID)
          # nên KHÔNG runAsNonRoot (kubelet không verify được UID phi số); image đã non-root sẵn.
          # KHÔNG readOnlyRootFilesystem (giữ an toàn cho /repo, /backups đã là mount riêng).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "set -o pipefail; ./api-server 2>&1 | tee /var/log/app/api.log"]
          ports: [{ containerPort: 8118 }]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef:    { name: api-secret }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8118 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/simple, port: 8118 }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - { name: backups, mountPath: /backups }
            - { name: repo, mountPath: /repo }
            - { name: logs, mountPath: /var/log/app }
        {{- include "stock.nginxAmbassador" (dict "portName" "http-proxy" "port" 18118) | nindent 8 }}
        {{- include "stock.logSidecar" (dict "image" (printf "%s:%s" $.Values.global.images.apiSvc $.Values.global.imageTag) "logfile" "api.log" "reqCpu" "20m" "reqMem" "32Mi" "limCpu" "100m" "limMem" "64Mi") | nindent 8 }}
      volumes:
        - { name: backups, emptyDir: {} }
        - { name: repo, emptyDir: {} }
        - { name: logs, emptyDir: {} }
        - name: nginx-conf
          configMap: { name: api-svc-nginx }
{{- end }}
{{- range $color := list "blue" "green" }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc-{{ $color }}
  namespace: {{ $.Release.Namespace }}
  labels: { app: api-svc, color: {{ $color }} }
spec:
  selector: { app: api-svc, color: {{ $color }} }
  # targetPort → ambassador nginx (:18118) → proxy_pass app :8118.
  ports: [{ port: 8118, targetPort: 18118 }]
{{- end }}
{{- end }}
