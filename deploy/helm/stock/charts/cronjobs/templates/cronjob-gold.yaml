# =============================================================================
# CronJob pipeline GOLD — Cách 2 (k8s-native).
# Pod dùng IMAGE prediction-svc và TỰ chạy pipeline (crawl→predict→reconcile) qua
# entrypoint run-once `python -m src.jobs_cli gold`, rồi exit. KHÔNG qua api-svc,
# KHÔNG gRPC, KHÔNG scheduler nội bộ (đã disable crawler_gold trong DEFAULT_SCHEDULES).
# Job Complete  <=>  pipeline thật sự chạy xong.
#
# Yêu cầu: image prediction-svc:dev đã kind load; ConfigMap prediction-config +
#          Secret prediction-secret đã apply (deploy/k8s/prediction-svc/); DB chạy.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-gold
  namespace: {{ .Release.Namespace }}
  labels: { app: pipeline, market: gold }
spec:
  schedule: "0 * * * *"                 # mỗi giờ phút 0 (5 trường — k8s)
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid             # lần cũ chưa xong thì bỏ lần mới
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2                    # pipeline lỗi -> retry tối đa 2 lần
      ttlSecondsAfterFinished: 1800      # tự dọn Job sau 30'
      template:
        spec:
          restartPolicy: Never
          # dnsConfig ndots:1 — mạng hotspot/ISP hijack NXDOMAIN: ndots:5 mặc định nối
          # search-domain rác (tailf643c3.ts.net / DHCP rò từ resolv.conf host) vào tên
          # external → ISP trả IP parking → crawl timeout 30s → saved=0. ndots:1 ép query
          # FQDN trước → IP thật. Tên in-cluster 1 nhãn (db) 0 dots vẫn expand bình thường.
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          # initContainer wait-db: chờ DB Ready trước khi pipeline connect (như api-svc).
          # Image timescaledb (đã có sẵn trong cluster) vì prediction-svc không có pg_isready.
          initContainers:
            - name: wait-db
              image: timescale/timescaledb:latest-pg16
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  echo "waiting for db:5432 ..."
                  until pg_isready -h db -p 5432 -U postgres; do
                    echo "db not ready, retry in 2s"; sleep 2
                  done
                  echo "db is ready"
          containers:
            - name: pipeline
              image: "{{ .Values.global.images.predictionSvc }}:{{ .Values.global.imageTag }}"
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "src.jobs_cli", "gold"]
              envFrom:
                - configMapRef: { name: prediction-config }   # DB host/port/user...
                - secretRef:    { name: prediction-secret }   # POSTGRES_PASSWORD
              resources:
                requests: { cpu: "250m", memory: "512Mi" }
                limits:   { cpu: "1500m", memory: "2Gi" }     # torch/ML
