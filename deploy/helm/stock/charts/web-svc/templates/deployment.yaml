{{- if not .Values.global.bluegreen.enabled }}
# =============================================================================
# web-svc — React + Vite build, phục vụ static qua Nginx (:3000).
#
# Build & load image:
#   docker build -t web-svc:dev -f deploy/web-svc.Dockerfile web-svc
#   kind load docker-image web-svc:dev --name ckad
#
# Không cần env (gọi API tương đối qua gateway). Truy cập qua gateway-svc, không expose trực tiếp.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc
  namespace: {{ .Release.Namespace }}
  labels: { app: web-svc }
spec:
  replicas: {{ .Values.replicas }}                    # ≥2 để rolling update zero-downtime
  # Lab 2.2 — Blue/Green kiểu 1 Deployment (mentor: chỉ 1 deploy, KHÔNG tạo 2 blue/green riêng).
  # maxSurge=100% => bung nguyên bộ pod MỚI (green) song song bộ CŨ (blue), green Ready hết rồi
  # mới gỡ blue => cutover blue/green-style zero-downtime; `rollout undo` = rollback tức thì.
  # (Kỹ thuật: đây là rolling update aggressive, không có "selector flip" vì 1 Deployment chỉ 1 bộ nhãn.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%             # green lên ĐỦ trước khi gỡ blue (blue/green-style)
      maxUnavailable: 0          # blue không bao giờ tụt dưới số replica mong muốn
  selector:
    matchLabels: { app: web-svc }
  template:
    metadata:
      labels: { app: web-svc }
    spec:
      tolerations:                          # HA: cho phép chạy trên node control-plane (dùng cả 3 node)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:            # HA: rải pod đều các node (kubernetes.io/hostname)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule     # hard: ép mỗi pod khác node
          matchLabelKeys: [pod-template-hash]  # spread theo từng ReplicaSet → rollout không kẹt
          labelSelector:
            matchLabels: { app: web-svc }
      containers:
        - name: web-svc
          image: "{{ .Values.global.images.webSvc }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }   # Service chỉ route pod đã sẵn sàng
            initialDelaySeconds: 2
            periodSeconds: 3
          # preStop: giữ pod phục vụ thêm 5s trong lúc bị gỡ khỏi Endpoints -> tránh
          # termination race, zero-dropped-connection khi rolling update.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
{{- end }}
