# =============================================================================
# RBAC + state cho gateway-native blue/green controller.
# Gateway (ServiceAccount gateway-svc) cần: đọc/watch/patch Deployment (get image,
# xác nhận Ready, patch image màu còn lại khi promote) + đọc/patch ConfigMap state.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-svc
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-bluegreen
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-bluegreen
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: gateway-svc
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: gateway-bluegreen
  apiGroup: rbac.authorization.k8s.io
---
# Persist màu active per app — gateway đọc lúc boot, ghi mỗi lần flip/rollback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-bluegreen-state
  namespace: {{ .Release.Namespace }}
data:
  web-svc: green
  api-svc: green
