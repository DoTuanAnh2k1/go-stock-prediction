# =============================================================================
# auth-svc — Java Spring Boot 3, gRPC :8120. Auth/RBAC + Flyway V1–V3.
# Seeds chon/super_admin lúc khởi động.
#
# Build & load image:
#   docker build -t auth-svc:dev -f deploy/auth-svc.Dockerfile auth-svc
#   kind load docker-image auth-svc:dev --name ckad
#
# Multi-container pod (pattern 4-container — CKAD):
#   init  wait-db     — chờ DB Ready (Flyway migrate lúc boot).         [stock.waitDb]
#   app   auth-svc    — Spring Boot gRPC :8120; tee log cho sidecar.
#   amb   nginx       — ambassador gRPC :18120 → localhost:8120.        [stock.nginxAmbassador]
#   side  log-sidecar — tail -f log app qua emptyDir chung.             [stock.logSidecar]
# Metrics/Actuator :9464 KHÔNG qua nginx (Prometheus scrape thẳng).
# Boilerplate lặp gom vào library chart charts/common (_ambassador.tpl).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-svc-nginx
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    {{- include "stock.nginxConf.grpc" (dict "listen" 18120 "upstream" 8120) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: {{ .Release.Namespace }}
  labels: { app: auth-svc }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: auth-svc }
  template:
    metadata:
      labels: { app: auth-svc }
      # ---- Prometheus scrape (factor 14 metrics) — Actuator/Prometheus trên :9464 ----
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: auth-svc          # CKAD 3.3 — SA riêng (automount:false, không gọi API)
      tolerations:                          # HA: chạy được trên node control-plane (dùng cả 3 node)
        {{- include "stock.tolerations" . | nindent 8 }}
      topologySpreadConstraints:            # HA: rải pod đều các node
        {{- include "stock.topologySpread" "auth-svc" | nindent 8 }}
      # seccompProfile RuntimeDefault (CKAD 3.2) cho mọi container trong pod. (Image Java
      # chạy USER root → KHÔNG runAsNonRoot; drop caps đặt ở container-level bên dưới.)
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # image auth-svc (Java) không có pg_isready nên wait-db dùng image timescaledb.
      initContainers:
        {{- include "stock.waitDb" (dict "image" "timescale/timescaledb:latest-pg16") | nindent 8 }}
      containers:
        # ---- App: Spring Boot gRPC :8120; tee log (JAVA_TOOL_OPTIONS agent otel vẫn tự áp) ----
        - name: auth-svc
          image: "{{ .Values.global.images.authSvc }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          # CKAD 3.2 — drop mọi capability + cấm privilege escalation. KHÔNG runAsNonRoot
          # (image Java USER root) và KHÔNG readOnlyRootFilesystem (JVM ghi /tmp: hsperfdata,
          # Spring temp, unpack jar). Đây là hardening tối đa an toàn cho container root.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "set -o pipefail; java -jar /app/app.jar 2>&1 | tee /var/log/app/auth.log"]
          ports:
            - name: grpc
              containerPort: 8120
            - name: mgmt              # Actuator HTTP: /metrics + health probes
              containerPort: 9464
          envFrom:
            - configMapRef: { name: auth-config }
            - secretRef:    { name: auth-secret }
          # ---- Health probes (factor 14) — Actuator health groups trên :9464 (trỏ THẲNG app) ----
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 9464 }
            failureThreshold: 30
            periodSeconds: 5          # tối đa ~150s cho JVM + Flyway migrate lúc boot
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9464 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9464 }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }   # JVM
        # ---- Ambassador nginx: reverse-proxy gRPC :18120 → localhost:8120 ----
        {{- include "stock.nginxAmbassador" (dict "portName" "grpc-proxy" "port" 18120) | nindent 8 }}
        # ---- Sidecar: xem log app qua emptyDir chung ----
        {{- include "stock.logSidecar" (dict "image" (printf "%s:%s" .Values.global.images.authSvc .Values.global.imageTag) "logfile" "auth.log") | nindent 8 }}
      volumes:
        - name: logs
          emptyDir: {}                 # chia sẻ giữa app "auth-svc" và "log-sidecar"
        - name: nginx-conf
          configMap: { name: auth-svc-nginx }
