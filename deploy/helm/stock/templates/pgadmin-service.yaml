{{- if .Values.pgadmin.enabled }}
# =============================================================================
# pgadmin — ClusterIP :80 (dùng port-forward để truy cập, giống bind 127.0.0.1 ở compose).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: pgadmin }
  ports:
    - port: 80
      targetPort: 80
{{- end }}
