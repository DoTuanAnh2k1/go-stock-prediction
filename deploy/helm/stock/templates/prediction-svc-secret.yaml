# =============================================================================
# prediction-svc — creds DB + MinIO S3.
# (plaintext stringData — education only; production dùng Vault/SealedSecret)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: prediction-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  # MinIO credentials — PHẢI khớp minio-secret (MINIO_ROOT_USER/PASSWORD).
  # S3_SECRET_KEY trước để "minioadmin" (sai) -> 403 Forbidden khi up/download model.
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
