# =============================================================================
# service-mgt — Go registry/discovery gRPC :8121.
#
# Build & load image:
#   docker build -t service-mgt:dev -f deploy/service-mgt.Dockerfile service-mgt
#   kind load docker-image service-mgt:dev --name ckad
#
# Multi-container pod (pattern 4-container — CKAD):
#   init  wait-db      — chờ DB Ready (pg_isready) rồi mới chạy.
#   app   service-mgt  — gRPC :8121; tee log ra /var/log/app cho sidecar đọc.
#   amb   nginx        — ambassador reverse-proxy gRPC :18121 → localhost:8121 (Service trỏ vào đây).
#   side  log-sidecar  — tail -f log app qua emptyDir chung.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-mgt-nginx
  namespace: {{ .Release.Namespace }}
data:
  # Ambassador nginx: nhận gRPC (http2) ở :18121, chuyển tiếp về app localhost:8121.
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      server {
        listen 18121;
        http2 on;
        location / {
          grpc_pass grpc://127.0.0.1:8121;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-mgt
  namespace: {{ .Release.Namespace }}
  labels: { app: service-mgt }
spec:
  replicas: {{ .Values.replicas.serviceMgt }}
  selector:
    matchLabels: { app: service-mgt }
  template:
    metadata:
      labels: { app: service-mgt }
      # Metrics live on the auxiliary HTTP port 9464 (service is gRPC-only) — KHÔNG qua nginx.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:                          # HA: cho phép chạy trên node control-plane (dùng cả 3 node)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:            # HA: rải pod đều các node (kubernetes.io/hostname)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule     # hard: ép mỗi pod khác node
          matchLabelKeys: [pod-template-hash]  # spread theo từng ReplicaSet → rollout không kẹt
          labelSelector:
            matchLabels: { app: service-mgt }
      # fsGroup: app chạy USER appuser (non-root) → cho phép ghi emptyDir "logs" (group-writable).
      securityContext:
        fsGroup: 2000
      # ---- initContainer wait-db: chờ DB Ready (pg_isready) rồi write-through mới chạy ----
      # image service-mgt (Go) không có pg_isready nên dùng image timescaledb (đã có sẵn).
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for db:5432 ..."
              until pg_isready -h db -p 5432 -U postgres; do
                echo "db not ready, retry in 2s"; sleep 2
              done
              echo "db is ready"
      containers:
        # ---- App: gRPC :8121; log vừa ra stdout vừa ghi file cho sidecar ----
        - name: service-mgt
          image: "{{ .Values.images.serviceMgt }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "set -o pipefail; ./service-mgt 2>&1 | tee /var/log/app/service-mgt.log"]
          ports:
            - { name: grpc, containerPort: 8121 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: service-mgt-config }
            - secretRef:    { name: service-mgt-secret }
          # Native gRPC health probes trỏ THẲNG app (:8121), không qua nginx.
          readinessProbe:
            grpc: { port: 8121 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc: { port: 8121 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
        # ---- Ambassador nginx: reverse-proxy gRPC :18121 → localhost:8121 (Service trỏ vào đây) ----
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc-proxy, containerPort: 18121 }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
        # ---- Sidecar: chỉ để xem log app (tail -f qua emptyDir chung) ----
        - name: log-sidecar
          image: "{{ .Values.images.serviceMgt }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until [ -f /var/log/app/service-mgt.log ]; do sleep 1; done; tail -f /var/log/app/service-mgt.log"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "64Mi" }
      volumes:
        - name: logs
          emptyDir: {}                 # chia sẻ giữa app "service-mgt" và "log-sidecar"
        - name: nginx-conf
          configMap: { name: service-mgt-nginx }
