# =============================================================================
# CronJob pipeline CRYPTO — Cách 2 (k8s-native). CRYPTO 24/7.
# `python -m src.jobs_cli crypto` — Pod tự chạy pipeline rồi exit.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-crypto
  namespace: {{ .Release.Namespace }}
  labels: { app: pipeline, market: crypto }
spec:
  schedule: "0 * * * *"                 # mỗi giờ phút 0
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          restartPolicy: Never
          # dnsConfig ndots:1 — mạng hotspot/ISP hijack NXDOMAIN: với ndots:5 mặc định,
          # tên external (vd api.coingecko.com, 2 dots) bị nối search-domain rác
          # (tailf643c3.ts.net / DHCP rò từ resolv.conf host) → ISP trả IP parking
          # (125.235.4.59) → crawl connect treo 30s → saved=0. ndots:1 ép query FQDN
          # trước → IP thật. Tên in-cluster 1 nhãn (db) 0 dots vẫn expand bình thường.
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          # initContainer wait-db: chờ DB Ready trước khi pipeline connect (như api-svc).
          # Image timescaledb (đã có sẵn trong cluster) vì prediction-svc không có pg_isready.
          initContainers:
            - name: wait-db
              image: timescale/timescaledb:latest-pg16
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  echo "waiting for db:5432 ..."
                  until pg_isready -h db -p 5432 -U postgres; do
                    echo "db not ready, retry in 2s"; sleep 2
                  done
                  echo "db is ready"
          containers:
            - name: pipeline
              image: "{{ .Values.images.predictionSvc }}:{{ .Values.global.imageTag }}"
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "src.jobs_cli", "crypto"]
              envFrom:
                - configMapRef: { name: prediction-config }
                - secretRef:    { name: prediction-secret }
              resources:
                requests: { cpu: "250m", memory: "512Mi" }
                limits:   { cpu: "1500m", memory: "2Gi" }
