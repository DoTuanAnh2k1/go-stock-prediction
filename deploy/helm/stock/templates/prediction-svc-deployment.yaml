# =============================================================================
# prediction-svc — Python gRPC (:8119). Crawling + 13 thuật toán ML + scheduler.
#
# Build & load image (repo root, vì Dockerfile lấy proto từ api-svc/):
#   docker build -t prediction-svc:dev -f deploy/prediction-svc.Dockerfile .
#   kind load docker-image prediction-svc:dev --name ckad
#
# Multi-container pod (pattern 4-container — CKAD):
#   init  wait-db        — chờ DB Ready (SQLAlchemy connect lúc khởi động).
#   app   prediction-svc — gRPC :8119; tee log ra /var/log/app cho sidecar.
#   amb   nginx          — ambassador gRPC :18119 → localhost:8119 (Service trỏ vào đây).
#   side  log-sidecar    — tail -f log app qua emptyDir chung.
# Metrics :9464 KHÔNG qua nginx (Prometheus scrape thẳng).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-svc-nginx
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      server {
        listen 18119;
        http2 on;
        location / {
          grpc_pass grpc://127.0.0.1:8119;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-svc
  namespace: {{ .Release.Namespace }}
  labels: { app: prediction-svc }
spec:
  replicas: {{ .Values.replicas.prediction }}
  selector:
    matchLabels: { app: prediction-svc }
  template:
    metadata:
      labels: { app: prediction-svc }
      annotations:
        # Prometheus pod scrape annotations (kubernetes_sd)
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:                          # HA: cho phép chạy trên node control-plane (dùng cả 3 node)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:            # HA: rải pod đều các node (kubernetes.io/hostname)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule     # hard: ép mỗi pod khác node
          matchLabelKeys: [pod-template-hash]  # spread theo từng ReplicaSet → rollout không kẹt
          labelSelector:
            matchLabels: { app: prediction-svc }
      # fsGroup: app chạy USER appuser (non-root) → ghi được emptyDir "logs" (group-writable).
      securityContext:
        fsGroup: 2000
      # dnsConfig ndots:1 — mạng hotspot/ISP hijack NXDOMAIN: ndots:5 mặc định nối
      # search-domain rác (tailf643c3.ts.net / DHCP rò từ resolv.conf host) vào tên
      # external (crawler_fundamentals yfinance, ...) → ISP trả IP parking → connect
      # timeout. ndots:1 ép query FQDN trước → IP thật. Tên in-cluster 1 nhãn 0 dots
      # (db, service-mgt) vẫn expand bình thường.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # ---- initContainer wait-db: chờ DB Ready (pg_isready) rồi SQLAlchemy mới connect ----
      # image prediction-svc (Python) không có pg_isready nên dùng image timescaledb (đã có sẵn).
      initContainers:
        - name: wait-db
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "waiting for db:5432 ..."
              until pg_isready -h db -p 5432 -U postgres; do
                echo "db not ready, retry in 2s"; sleep 2
              done
              echo "db is ready"
      containers:
        # ---- App: gRPC :8119; tee log cho sidecar ----
        - name: prediction-svc
          image: "{{ .Values.images.predictionSvc }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "set -o pipefail; python -m src.main 2>&1 | tee /var/log/app/prediction.log"]
          ports:
            - name: grpc
              containerPort: 8119
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef: { name: prediction-config }
            - secretRef:    { name: prediction-secret }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1500m", memory: "2Gi" }   # torch/ML nặng RAM
          # ---- Health probes: tcpSocket :8119 (trỏ THẲNG app, gRPC không đăng ký health.v1) ----
          readinessProbe:
            tcpSocket:
              port: 8119
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8119
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
            - name: logs
              mountPath: /var/log/app
        # ---- Ambassador nginx: reverse-proxy gRPC :18119 → localhost:8119 ----
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc-proxy, containerPort: 18119 }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "64Mi" }
        # ---- Sidecar: xem log app qua emptyDir chung ----
        - name: log-sidecar
          image: "{{ .Values.images.predictionSvc }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until [ -f /var/log/app/prediction.log ]; do sleep 1; done; tail -f /var/log/app/prediction.log"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "64Mi" }
      volumes:
        - name: models
          # emptyDir — ephemeral local cache (model files are read-through from S3/MinIO
          # at load time when MODEL_STORE_BACKEND=s3; populated per-pod on first load).
          emptyDir: {}
        - name: logs
          emptyDir: {}                 # chia sẻ giữa app "prediction-svc" và "log-sidecar"
        - name: nginx-conf
          configMap: { name: prediction-svc-nginx }
