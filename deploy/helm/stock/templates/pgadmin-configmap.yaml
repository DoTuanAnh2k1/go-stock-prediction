{{- if .Values.pgadmin.enabled }}
# =============================================================================
# pgadmin — email đăng nhập (không nhạy cảm). Tùy chọn, chỉ để quản trị DB.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
  namespace: {{ .Release.Namespace }}
data:
  PGADMIN_DEFAULT_EMAIL: admin@local.dev
{{- end }}
