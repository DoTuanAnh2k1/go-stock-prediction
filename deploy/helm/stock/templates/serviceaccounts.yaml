{{- if .Values.global.rbac.enabled }}
# =============================================================================
# CKAD Lab 3.3 — ServiceAccount & RBAC (áp thẳng lên 5 backend deploy THẬT).
#
# (A) Per-service ServiceAccount + automountServiceAccountToken:false
#     5 backend (api/auth/prediction/service-mgt/cli) KHÔNG gọi Kubernetes API
#     (chúng nói chuyện với nhau qua Service DNS + gRPC riêng). Trước đây chạy SA
#     `default` với token TỰ ĐỘNG mount vào /var/run/secrets/... → attack surface
#     thừa. Cho mỗi service 1 SA riêng, automount=false → KHÔNG mount token nữa.
#     (gateway-svc GIỮ SA riêng + Role gateway-bluegreen vì nó THỰC SỰ gọi API.)
#
# (B) pod-reader SA + Role + RoleBinding — artifact RBAC minh hoạ "Pod dùng SA
#     token list Pod trong namespace qua API". Role chỉ get/list/watch (đọc), scope
#     ns stock. Verify: `kubectl auth can-i list pods --as=system:serviceaccount:stock:pod-reader -n stock`
#     = yes; cùng lệnh với SA khác (auth-svc) = no → RBAC scope đúng.
#
# Toggle: global.rbac.enabled (default true).
# =============================================================================
{{- range $svc := list "api-svc" "auth-svc" "prediction-svc" "service-mgt" "cli-svc" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc }}
  namespace: {{ $.Release.Namespace }}
  labels: { app: {{ $svc }} }
# Không gọi k8s API → không mount token (least privilege, giảm attack surface).
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]      # CHỈ đọc — không create/delete/patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
