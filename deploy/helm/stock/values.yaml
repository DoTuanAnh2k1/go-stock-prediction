# =============================================================================
# values.yaml — umbrella chart "stock" (ns stock).
# Chỉnh: helm upgrade stock deploy/helm/stock -n stock [--set ...]
#
# CẤU TRÚC: mỗi service là 1 subchart trong charts/<svc>/. Giá trị DÙNG CHUNG cho
# nhiều subchart đặt ở global: (subchart đọc qua .Values.global.*). Giá trị RIÊNG
# của từng service (replicas) nằm ở charts/<svc>/values.yaml, override bằng
# --set <svc>.replicas=N (vd: --set web-svc.replicas=4).
# =============================================================================

global:
  # Tag chung cho MỌI app image (*-svc). Bump 1 chỗ:
  #   helm upgrade stock deploy/helm/stock -n stock --set global.imageTag=v2
  imageTag: dev
  imagePullPolicy: IfNotPresent   # template giữ literal IfNotPresent (giá trị này để tham chiếu)

  # Repository (tên image) của các app service tự build. Kết với global.imageTag.
  images:
    apiSvc: api-svc
    authSvc: auth-svc
    cliSvc: cli-svc
    gatewaySvc: gateway-svc
    predictionSvc: prediction-svc
    serviceMgt: service-mgt
    webSvc: web-svc

  # Bí mật — CHỈ PLACEHOLDER DEV để stack chạy out-of-the-box (không phải credential
  # thật → an toàn commit). Production PHẢI override qua file GITIGNORE:
  #   cp deploy/helm/stock/values-secret.yaml.example deploy/helm/stock/values-secret.yaml
  #   helm upgrade --install stock deploy/helm/stock -n stock -f .../values-secret.yaml
  # (hoặc --set / secret manager / SealedSecrets). Xem values-secret.yaml.example.
  secrets:
    postgresUser: postgres
    postgresPassword: "123"
    postgresDb: go_stock_prediction
    jwtSecret: change-me-in-dev
    internalSecret: change-me-in-dev
    adminPassword: admin123
    s3AccessKey: minioadmin
    s3SecretKey: minioadmin123
    minioRootUser: minioadmin
    minioRootPassword: minioadmin123
    pgadminPassword: admin

  # Toggle dùng chung (nhiều subchart / parent đọc → đặt ở global).
  bluegreen:
    # BẮT BUỘC true cho stack này: gateway-svc route CỨNG /api→api-svc-<color>,
    # /→web-svc-<color> (blue/green automation baked trong image, không fallback base
    # routing). false = single sẽ làm gateway 502. Blue/green cũng thỏa HA
    # (blue+green ≥2 pod/service + spread + PDB).
    enabled: true
    # activeColor — màu mà SERVICE CHUNG api-svc/web-svc trỏ vào (selector kèm color).
    # Đây là blue/green KINH ĐIỂN: 1 Service chung + selector color, cutover = FLIP selector.
    #   Declarative: helm upgrade --set global.bluegreen.activeColor=blue
    #   Imperative:  kubectl patch svc api-svc -n stock -p '{"spec":{"selector":{"color":"blue"}}}'
    #   Rollback   : flip lại về green.
    # (Song song với gateway-native routing per-color; giữ activeColor khớp gateway ConfigMap.)
    activeColor: green
  pgadmin:
    enabled: true       # UI quản trị DB (subchart charts/pgadmin)
  manualJob:
    enabled: false      # job-manual (Job chạy tay) — bật: --set global.manualJob.enabled=true
  pdb:
    enabled: true       # PodDisruptionBudget — stateless: maxUnavailable 1; db/minio: minAvailable 1
                        # LƯU Ý: PDB minAvailable 1 trên db/minio (1 replica) CHẶN drain node
                        # → khi cần drain node chứa db/minio phải scale=0 hoặc kubectl drain --force.
  quota:
    enabled: true       # CKAD 3.4 — LimitRange (default request/limit) + ResourceQuota (trần ns).
                        # Size ~2.5–3x mức đang dùng để KHÔNG chặn rollout/blue-green.
                        # Tắt: --set global.quota.enabled=false (templates/quota.yaml).
  rbac:
    enabled: true       # CKAD 3.3 — per-service ServiceAccount (automount:false) cho 5 backend
                        # + pod-reader Role/RoleBinding. Tắt: --set global.rbac.enabled=false
                        # (templates/serviceaccounts.yaml). gateway-svc RBAC nằm ở subchart riêng.
  ingress:
    enabled: false      # CKAD 4.2 — Ingress / → web-svc, /api → api-svc. Default TẮT: cần
                        # ingress controller (kind chưa có). Bật sau khi cài ingress-nginx:
                        # --set global.ingress.enabled=true (templates/ingress.yaml).
    className: nginx
    host: stock.local
  networkPolicy:
    enabled: false      # CKAD 4.3 — default-deny + allow-graph. kindnet CÓ enforce (verified).
                        # Default TẮT vì default-deny cần allow đủ (Prometheus scrape :9464...)
                        # nếu không sẽ cắt nhầm metrics. Bật demo: --set global.networkPolicy.enabled=true
                        # (templates/networkpolicy.yaml — đã allow gateway + ingress-nginx→frontend).
  hpa:
    enabled: false      # CKAD 2.3 áp thật — HPA CPU cho api-svc (blue/green) + gateway-svc.
                        # Default TẮT: service idle nên CPU-HPA chỉ scale khi traffic spike thật;
                        # khi bật, deployment omit .spec.replicas (HPA sở hữu → tránh flapping).
                        # Bật: --set global.hpa.enabled=true (templates/hpa.yaml).
    apiSvc:     { minReplicas: 2, maxReplicas: 6, targetCPU: 60 }
    gatewaySvc: { minReplicas: 2, maxReplicas: 5, targetCPU: 60 }

# HA: mọi service stateless ≥2 pod (replicas ở charts/<svc>/values.yaml), rải đều 3 node
# (topologySpreadConstraints) + PDB. db & minio stateful (PVC RWO) → 1 replica.
# Ghi đè replicas per-service: --set <svc>.replicas=N.
