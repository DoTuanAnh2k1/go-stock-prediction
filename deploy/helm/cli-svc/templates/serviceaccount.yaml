# =============================================================================
# cli-svc — ServiceAccount riêng (CKAD 3.3). automountServiceAccountToken:false
# vì cli-svc KHÔNG gọi Kubernetes API. Deployment hard-ref serviceAccountName:
# cli-svc nên SA này tạo VÔ ĐIỀU KIỆN (trước đây ở umbrella serviceaccounts.yaml).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cli-svc
  namespace: {{ .Release.Namespace }}
  labels: { app: cli-svc }
automountServiceAccountToken: false
