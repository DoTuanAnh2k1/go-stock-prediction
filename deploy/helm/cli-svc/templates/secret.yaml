# =============================================================================
# cli-svc — INTERNAL_SECRET (gọi POST /api/command-handlers/upsert khi boot).
# PHẢI KHỚP với api-svc/auth-svc.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cli-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  INTERNAL_SECRET: {{ .Values.secrets.internalSecret | quote }}
