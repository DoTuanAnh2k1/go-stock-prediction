{{- if .Values.grafana.enabled }}
# =============================================================================
# Grafana — UI hợp nhất metrics (Prometheus) + traces (Tempo).
# Anonymous admin (education: không cần login).
#
# Datasources (provisioned):
#   Prometheus  http://prometheus.observability:9090   (default)
#   Tempo       http://tempo.observability:3200        (traces + trace->metrics)
#
# Apply (SAU prometheus.yaml + tempo.yaml):
#   kubectl apply -f deploy/k8s/observability/grafana.yaml
#
# Truy cập:
#   kubectl -n observability port-forward svc/grafana 3000:3000
#   → http://localhost:3000  (vào thẳng, anonymous Admin)
#   hoặc NodePort 30300 (kind: cần extraPortMappings, mặc định dùng port-forward).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Release.Namespace }}
  labels: { app: grafana }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus
        url: http://prometheus.observability:9090
        isDefault: true
        jsonData:
          httpMethod: POST
      - name: Tempo
        type: tempo
        access: proxy
        uid: tempo
        url: http://tempo.observability:3200
        jsonData:
          # Trace -> metrics correlation: từ 1 span, nhảy sang Prometheus query
          # theo service.name để xem request rate / latency của service đó.
          tracesToMetrics:
            datasourceUid: prometheus
            tags:
              - { key: service.name, value: service }
            queries:
              - name: "Request rate"
                query: 'sum(rate(http_requests_total{$$__tags}[5m]))'
          # Trace -> logs: từ 1 span, nhảy sang Loki query theo request_id
          # (X-Request-ID correlation) và service label.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: '{app=~".+"} |= "$$${__span.tags.request_id}"'
            tags:
              - { key: service.name, value: app }
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
      - name: Loki
        type: loki
        access: proxy
        uid: loki
        url: http://loki.{{ .Release.Namespace }}:3100
        jsonData:
          # Loki -> Tempo correlation: từ log line có traceID field,
          # nhảy sang Tempo để xem full trace.
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: {{ .Release.Namespace }}
  labels: { app: grafana }
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels: { app: grafana }
data:
  services-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "schemaVersion": 39,
      "tags": ["stock", "overview"],
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Stock Prediction — Services Overview",
      "uid": "stock-services",
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(service)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request rate (req/s) per service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total{service=~\"$service\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Latency p95 (s) per service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{service=~\"$service\"}[5m])))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error rate (5xx req/s) per service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service) (rate(http_requests_total{service=~\"$service\", code=~\"5..\"}[5m]))",
              "legendFormat": "{{`{{service}}`}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Traces (Tempo search)",
          "type": "traces",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "tempo", "uid": "tempo" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceql",
              "query": "{}",
              "limit": 20
            }
          ]
        }
      ]
    }
  resources.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "schemaVersion": 39,
      "tags": ["stock", "resources"],
      "time": { "from": "now-30m", "to": "now" },
      "timezone": "browser",
      "title": "Stock Prediction — Resources (CPU/RAM)",
      "uid": "stock-resources",
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "CPU per pod — ns stock (cores)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"stock\",container!=\"\",container!=\"POD\"}[2m])) by (pod)", "legendFormat": "{{`{{pod}}`}}" }
          ]
        },
        {
          "id": 2,
          "title": "Memory working-set per pod — ns stock",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(container_memory_working_set_bytes{namespace=\"stock\",container!=\"\",container!=\"POD\"}) by (pod)", "legendFormat": "{{`{{pod}}`}}" }
          ]
        },
        {
          "id": 3,
          "title": "Node CPU used %",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "100 - (avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[2m])) * 100)", "legendFormat": "{{`{{instance}}`}}" }
          ]
        },
        {
          "id": 4,
          "title": "Node memory used %",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{`{{instance}}`}}" }
          ]
        },
        {
          "id": 5,
          "title": "% CPU per pod (của limit) — ns stock",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"stock\",container!=\"\",container!=\"POD\"}[2m])) by (pod) / sum(kube_pod_container_resource_limits{namespace=\"stock\",resource=\"cpu\"}) by (pod) * 100", "legendFormat": "{{`{{pod}}`}}" }
          ]
        },
        {
          "id": 6,
          "title": "% RAM per pod (của limit) — ns stock",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(container_memory_working_set_bytes{namespace=\"stock\",container!=\"\",container!=\"POD\"}) by (pod) / sum(kube_pod_container_resource_limits{namespace=\"stock\",resource=\"memory\"}) by (pod) * 100", "legendFormat": "{{`{{pod}}`}}" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        fsGroup: 472           # grafana user
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          imagePullPolicy: IfNotPresent
          env:
            # Anonymous access với quyền Admin — education, không cần login.
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_AUTH_BASIC_ENABLED, value: "false" }
            - { name: GF_SECURITY_ALLOW_EMBEDDING, value: "true" }
            - { name: GF_USERS_DEFAULT_THEME, value: "dark" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels: { app: grafana }
spec:
  # NodePort để tiện truy cập; port-forward vẫn dùng được như thường.
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 30300 }
{{- end }}
