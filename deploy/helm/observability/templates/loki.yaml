{{- if .Values.loki.enabled }}
# =============================================================================
# Grafana Loki — single-binary (monolithic) log aggregation backend.
# Nhận log từ Promtail qua HTTP push API :3100/loki/api/v1/push.
# Grafana query qua HTTP API :3100 (datasource "Loki").
#
# Storage: filesystem, PVC 1Gi mount /loki (schema tsdb).
# auth_enabled: false — education / dev-scale, không cần login.
# Retention: 72h (chunk store + index).
#
# Ports:
#   3100  — Loki HTTP (Promtail push + Grafana query)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Release.Namespace }}
  labels: { app: loki }
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    ruler:
      alertmanager_url: http://localhost:9093

    limits_config:
      retention_period: 72h
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: {{ .Release.Namespace }}
  labels: { app: loki }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.loki.pvcSize }}
  # storageClassName bỏ trống => StorageClass mặc định của kind (standard)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels: { app: loki }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loki }
  strategy:
    type: Recreate           # PVC RWO — không cho 2 pod ghi cùng lúc khi rollout
  template:
    metadata:
      labels: { app: loki }
    spec:
      securityContext:
        fsGroup: 10001         # loki chạy user 10001, cần ghi được PVC
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: loki
          image: "{{ .Values.loki.image }}:{{ .Values.loki.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/loki/loki.yaml"
            - "-target=all"
          ports:
            - { name: http, containerPort: 3100 }
            - { name: grpc, containerPort: 9096 }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data,   mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels: { app: loki }
spec:
  selector: { app: loki }
  ports:
    - { name: http, port: 3100, targetPort: 3100 }
{{- end }}
