# =============================================================================
# auth-svc — creds DB + JWT/INTERNAL secret.
# JWT_SECRET & INTERNAL_SECRET PHẢI KHỚP với api-svc (api-svc validate JWT local,
# cli-svc dùng INTERNAL_SECRET) — giữ cùng giá trị dev.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ required "auth-svc: secrets.jwtSecret is required (provide via -f values-secret.yaml)" .Values.secrets.jwtSecret | quote }}
  INTERNAL_SECRET: {{ required "auth-svc: secrets.internalSecret is required (provide via -f values-secret.yaml)" .Values.secrets.internalSecret | quote }}
  SUPER_ADMIN_PASSWORD: {{ required "auth-svc: secrets.superAdminPassword is required (provide via -f values-secret.yaml)" .Values.secrets.superAdminPassword | quote }}
