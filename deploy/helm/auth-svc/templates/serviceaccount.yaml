# =============================================================================
# auth-svc — ServiceAccount riêng (CKAD 3.3). automountServiceAccountToken:false
# vì auth-svc KHÔNG gọi Kubernetes API. Deployment hard-ref serviceAccountName:
# auth-svc nên SA này tạo VÔ ĐIỀU KIỆN (trước đây ở umbrella serviceaccounts.yaml).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-svc
  namespace: {{ .Release.Namespace }}
  labels: { app: auth-svc }
automountServiceAccountToken: false
