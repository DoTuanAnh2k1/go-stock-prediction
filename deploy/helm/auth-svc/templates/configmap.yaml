# =============================================================================
# auth-svc — env không nhạy cảm (Java Spring Boot gRPC :8120).
# Lưu ý: auth-svc dùng tiền tố DB_* (khác api/prediction dùng POSTGRES_*).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: {{ .Release.Namespace }}
data:
  SUPER_ADMIN_USERNAME: "chon"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_NAME: go_stock_prediction
  DB_USER: postgres
  GRPC_PORT: "8120"
  SERVICE_MGT_ENABLED: "false"
  REGISTRY_GRPC_TARGET: "service-mgt:8121"
  # ---- Actuator management server (metrics + health probes) ----
  MANAGEMENT_PORT: "9464"
  # ---- OpenTelemetry Java agent (tracing → OTel Collector) ----
  # Agent attach qua JAVA_TOOL_OPTIONS. Chỉ export TRACES qua agent; metrics đi qua
  # Actuator/Prometheus (:9464), logs qua stdout → nên tắt metrics/logs exporter của agent.
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
  OTEL_SERVICE_NAME: "auth-svc"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=stock,deployment.environment=kind"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
