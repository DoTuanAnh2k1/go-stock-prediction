# Cấu hình self-contained cho auth-svc (chart độc lập, không còn global: của umbrella).
replicas: 2
imageTag: "1.0.0"            # release tag; CI overrides: --set imageTag=$(git rev-parse --short HEAD)
image: auth-svc
# secrets: provided at deploy time via -f values-secret.yaml (see values-secret.yaml.example); no weak defaults shipped.
secrets:
  postgresPassword: ""    # auth_svc role password for auth_db — provide via -f values-secret.yaml
  jwtSecret: ""
  internalSecret: ""
  superAdminPassword: ""
