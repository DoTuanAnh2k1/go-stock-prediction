# =============================================================================
# service-mgt — ServiceAccount riêng (CKAD 3.3). automountServiceAccountToken:
# false vì service-mgt KHÔNG gọi Kubernetes API. Deployment hard-ref
# serviceAccountName: service-mgt nên SA này tạo VÔ ĐIỀU KIỆN
# (trước đây ở umbrella serviceaccounts.yaml).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-mgt
  namespace: {{ .Release.Namespace }}
  labels: { app: service-mgt }
automountServiceAccountToken: false
