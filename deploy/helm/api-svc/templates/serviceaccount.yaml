# =============================================================================
# api-svc — ServiceAccount riêng (CKAD 3.3). automountServiceAccountToken: false
# vì api-svc KHÔNG gọi Kubernetes API. Deployment hard-reference SA này
# (serviceAccountName: api-svc) → tạo VÔ ĐIỀU KIỆN.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-svc
  namespace: {{ .Release.Namespace }}
  labels: { app: api-svc }
automountServiceAccountToken: false
