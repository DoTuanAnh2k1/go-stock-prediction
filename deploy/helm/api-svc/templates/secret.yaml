# =============================================================================
# api-svc — env NHẠY CẢM (mật khẩu / JWT). Cặp với configmap.yaml.
# stringData: k8s tự base64-encode khi lưu (đọc lại sẽ là base64 trong data).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Phase 2: api-svc is DB-less — no POSTGRES_PASSWORD (holds no DB credentials).
  JWT_SECRET: {{ required "api-svc: secrets.jwtSecret is required (provide via -f values-secret.yaml)" .Values.secrets.jwtSecret | quote }}
  INTERNAL_SECRET: {{ required "api-svc: secrets.internalSecret is required (provide via -f values-secret.yaml)" .Values.secrets.internalSecret | quote }}
