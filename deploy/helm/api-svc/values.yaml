# api-svc — chart độc lập, self-contained values (không còn global: của umbrella).
replicas: 2
imageTag: "1.0.0"            # release tag; CI overrides: --set imageTag=$(git rev-parse --short HEAD)
image: api-svc
# secrets: provided at deploy time via -f values-secret.yaml (see values-secret.yaml.example); no weak defaults shipped.
secrets:
  # Phase 2: api-svc is DB-less — no postgresPassword needed.
  jwtSecret: ""
  internalSecret: ""
bluegreen:
  enabled: true
  activeColor: green
hpa:
  enabled: false
  apiSvc: { minReplicas: 2, maxReplicas: 6, targetCPU: 60 }
