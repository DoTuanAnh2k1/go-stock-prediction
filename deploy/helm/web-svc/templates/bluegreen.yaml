{{- if .Values.bluegreen.enabled }}
# =============================================================================
# web-svc blue/green — 2 Deployment + 2 Service (per màu) cho gateway-native
# blue/green automation. Gateway route "/" tới Service của màu active (config.yaml
# bluegreen), watch 2 Deployment, tự promote/rollback.
#
# Steady state: cả 2 màu cùng image (web-svc:dev). Deploy = set image màu IDLE.
# container name = "web-svc" (controller patch container[0] theo tên).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc-blue
  namespace: {{ .Release.Namespace }}
  labels: { app: web-svc, color: blue }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: web-svc, color: blue }
  template:
    metadata:
      labels: { app: web-svc, color: blue }
    spec:
      tolerations:                          # HA: cho phép chạy trên node control-plane (dùng cả 3 node)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:            # HA: rải pod đều các node (kubernetes.io/hostname)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule     # hard: ép mỗi pod khác node
          matchLabelKeys: [pod-template-hash]  # spread theo từng ReplicaSet → rollout không kẹt
          labelSelector:
            matchLabels: { app: web-svc }
      containers:
        - name: web-svc
          image: "{{ .Values.image }}:{{ .Values.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:                        # O1 — restart pod nếu nginx frontend chết
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-svc-green
  namespace: {{ .Release.Namespace }}
  labels: { app: web-svc, color: green }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: web-svc, color: green }
  template:
    metadata:
      labels: { app: web-svc, color: green }
    spec:
      tolerations:                          # HA: cho phép chạy trên node control-plane (dùng cả 3 node)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:            # HA: rải pod đều các node (kubernetes.io/hostname)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule     # hard: ép mỗi pod khác node
          matchLabelKeys: [pod-template-hash]  # spread theo từng ReplicaSet → rollout không kẹt
          labelSelector:
            matchLabels: { app: web-svc }
      containers:
        - name: web-svc
          image: web-svc:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:                        # O1 — restart pod nếu nginx frontend chết
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc-blue
  namespace: {{ .Release.Namespace }}
  labels: { app: web-svc, color: blue }
spec:
  selector: { app: web-svc, color: blue }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc-green
  namespace: {{ .Release.Namespace }}
  labels: { app: web-svc, color: green }
spec:
  selector: { app: web-svc, color: green }
  ports: [{ port: 3000, targetPort: 3000 }]
{{- end }}
