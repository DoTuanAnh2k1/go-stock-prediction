# =============================================================================
# MinIO — S3-compatible object store trong ns `stock`. Lưu model checkpoint
# (RL/transformer/meta) cho prediction-svc stateless (factor 4/6).
#
# Endpoints:
#   :9000  — S3 API  (S3_ENDPOINT=http://minio.stock:9000)
#   :9001  — Web console
#
# Bucket `models` được tạo idempotent bởi Job minio-createbucket (image mc).
#
# prediction-svc env (đặt ở deployment prediction-svc, KHÔNG ở đây):
#   MODEL_STORE_BACKEND=s3
#   S3_ENDPOINT=http://minio.stock:9000
#   S3_BUCKET=models
#   S3_ACCESS_KEY=minioadmin
#   S3_SECRET_KEY=minioadmin123
#
# Apply:
#   kubectl apply -f deploy/k8s/minio/minio.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: {{ .Release.Namespace }}
  labels: { app: minio }
type: Opaque
stringData:
  # Plaintext OK — project education (factor #15 chủ động bỏ qua).
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: {{ .Release.Namespace }}
  labels: { app: minio }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName bỏ trống => StorageClass mặc định của kind (standard)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels: { app: minio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  strategy:
    type: Recreate           # PVC RWO — single writer
  template:
    metadata:
      labels: { app: minio }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-09-13T20-26-02Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_PASSWORD } }
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels: { app: minio }
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# ---------------------------------------------------------------------------
# Job: tạo bucket `models` (idempotent). Chờ MinIO Ready rồi mc mb --ignore-existing.
# ttlSecondsAfterFinished dọn Pod sau khi xong.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-createbucket
  namespace: {{ .Release.Namespace }}
  labels: { app: minio }
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: minio, job: minio-createbucket }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-09-16T17-43-14Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: MINIO_ROOT_PASSWORD } }
          command:
            - sh
            - -c
            - |
              set -e
              echo "waiting for minio api ..."
              until mc alias set local http://minio.stock:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "minio not ready, retry in 2s"; sleep 2
              done
              echo "creating bucket models (idempotent) ..."
              mc mb --ignore-existing local/models
              mc ls local
              echo "done"
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
