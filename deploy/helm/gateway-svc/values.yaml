# gateway-svc — chart độc lập, self-contained values (không còn global: của umbrella).
replicas: 2
imageTag: "1.0.0"            # release tag; CI overrides: --set imageTag=$(git rev-parse --short HEAD)
image: gateway-svc
bluegreen: { enabled: true }
hpa:
  enabled: false
  gatewaySvc: { minReplicas: 2, maxReplicas: 5, targetCPU: 60 }
ingress:
  enabled: false
  className: nginx
  host: stock.local
