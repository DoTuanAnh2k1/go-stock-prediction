# =============================================================================
# gateway-svc — NodePort (điểm vào từ ngoài cluster).
#   http  80  -> nodePort 30080
#   https 443 -> nodePort 30443
# Truy cập host: cần kind extraPortMappings (30080/30443) hoặc dùng port-forward:
#   kubectl port-forward -n stock svc/gateway-svc 8443:443
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector: { app: gateway-svc }
  ports:
    - { name: http,  port: 80,  targetPort: 80,  nodePort: 30080 }
    - { name: https, port: 443, targetPort: 443, nodePort: 30443 }
