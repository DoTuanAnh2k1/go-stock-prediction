# =============================================================================
# kafka-consumers — creds DB (prediction_svc role, market_db).
# (plaintext stringData — education only; production dùng Vault/SealedSecret)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kafka-consumers-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "kafka-consumers: secrets.postgresPassword is required (provide via -f values-secret.yaml)" .Values.secrets.postgresPassword | quote }}
