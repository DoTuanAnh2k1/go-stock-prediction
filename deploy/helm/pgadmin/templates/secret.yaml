# =============================================================================
# pgadmin — mật khẩu đăng nhập.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  PGADMIN_DEFAULT_PASSWORD: {{ required "pgadmin: secrets.pgadminPassword is required (provide via -f values-secret.yaml)" .Values.secrets.pgadminPassword | quote }}
