          schema:
            type: string
      summary: Simple health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'JWT token from POST /api/x/grant. Format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
