    get:
      description: Returns bots ranked by total_return_pct. Supports filtering by
        market, algorithm, currency and bot search; optional server-side sort and
        pagination (page/page_size). When page/page_size are omitted, all matching
        rows are returned (backward compatible). Always returns chart aggregates (distribution,
        top_returns) over the full filtered set.
      parameters:
      - description: Filter by market (e.g. GOLD, CRYPTO)
        in: query
        name: market
        type: string
      - description: Filter by algorithm key (e.g. lstm_nn)
        in: query
        name: algorithm
        type: string
      - description: Filter by currency (VND or USD)
        in: query
        name: currency
        type: string
      - description: Filter by bot id / display name (case-insensitive substring)
        in: query
        name: search
        type: string
      - description: 'Sort column: rank|display_name|market|algorithm|initial_capital|final_value|total_return_pct|annualized_return_pct|sharpe_ratio|max_drawdown_pct|win_rate_pct|profit_factor|total_trades
          (default total_return_pct)'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction: asc|desc (default desc)'
        in: query
        name: sort_dir
        type: string
      - description: Page number (1-based); enables pagination
        in: query
        name: page
        type: integer
      - description: Rows per page (default 50, max 200); enables pagination
        in: query
        name: page_size
        type: integer
      - description: Include inactive bots (default false = active only)
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_server.leaderboardResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      summary: Get simulation leaderboard
      tags:
      - Simulation
