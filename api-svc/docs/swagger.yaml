host: localhost:8118
info:
  contact: {}
  description: Financial asset prediction system — ML algorithms (VWMA, EMA, LSTM,
    ARIMA-GARCH, Ensemble) for gold, NASDAQ, crypto, and S&P 500.
  title: Go Stock Prediction API
  version: "1.0"
paths:
  /api/auth/me:
    get:
      description: Returns username and role from JWT claims (no DB call)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_server.userInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /api/auth/password:
    put:
      consumes:
      - application/json
      description: Proxies to Java Auth Service — validates current password before
        updating
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /api/backups:
    get:
      description: Returns a list of all available database backup files, sorted newest
        first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pkg_server.BackupInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: List database backups
      tags:
      - Backup
  /api/backups/{filename}:
    delete:
      description: Deletes a backup file from the backup directory. Requires admin
        role.
      parameters:
      - description: Backup filename (e.g. backup_20260605_120000.sql.gz)
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Delete a backup file
      tags:
      - Backup
    get:
      description: Streams a backup file as an application/gzip download.
      parameters:
      - description: Backup filename (e.g. backup_20260605_120000.sql.gz)
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/gzip
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Download a backup file
      tags:
      - Backup
  /api/command-groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pkg_server.commandGroupDTO'
            type: array
      security:
      - BearerAuth: []
      summary: List command groups
      tags:
      - CommandGroups
    post:
      consumes:
      - application/json
      parameters:
      - description: Group details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.createGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/pkg_server.commandGroupDTO'
      security:
      - BearerAuth: []
      summary: Create command group
      tags:
      - CommandGroups
  /api/command-groups/{id}:
    delete:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete command group
      tags:
      - CommandGroups
    put:
      consumes:
      - application/json
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: New name/description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.createGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_server.commandGroupDTO'
      security:
      - BearerAuth: []
      summary: Update command group
      tags:
      - CommandGroups
  /api/command-groups/{id}/commands:
    put:
      consumes:
      - application/json
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: Command IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.setGroupCommandsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set commands for a group (replaces existing)
      tags:
      - CommandGroups
  /api/command-groups/{id}/users:
    get:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go-stock-prediction_proto_auth.UserResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List users in a command group
      tags:
      - CommandGroups
    post:
      consumes:
      - application/json
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.addUserToGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add user to command group
      tags:
      - CommandGroups
  /api/command-groups/{id}/users/{uid}:
    delete:
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: path
        name: uid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove user from command group
      tags:
      - CommandGroups
  /api/command-handlers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pkg_server.handlerDTO'
            type: array
      security:
      - BearerAuth: []
      summary: List CLI handler catalog
      tags:
      - Commands
  /api/command-handlers/upsert:
    post:
      consumes:
      - application/json
      description: Internal endpoint used by cli-svc to push its handler catalog.
        No JWT — protected by a shared secret in the request body (config INTERNAL_SECRET).
      parameters:
      - description: Handler catalog + shared secret
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.upsertHandlersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      summary: Upsert CLI handler catalog (internal)
      tags:
      - Commands
  /api/commands:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pkg_server.commandDTO'
            type: array
      security:
      - BearerAuth: []
      summary: List commands
      tags:
      - Commands
    post:
      consumes:
      - application/json
      parameters:
      - description: Command details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.createCommandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/pkg_server.commandDTO'
      security:
      - BearerAuth: []
      summary: Create command
      tags:
      - Commands
  /api/commands/{id}:
    delete:
      parameters:
      - description: Command ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete command
      tags:
      - Commands
    put:
      consumes:
      - application/json
      parameters:
      - description: Command ID
        in: path
        name: id
        required: true
        type: integer
      - description: Command details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pkg_server.createCommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_server.commandDTO'
      security:
      - BearerAuth: []
      summary: Update command
      tags:
      - Commands
  /api/crypto/chart:
    get:
      description: Returns chronologically ordered date labels and closing prices
        for charting. When days=1, returns hourly intraday data; otherwise returns
        daily data.
      parameters:
      - description: Coin ID (e.g. bitcoin, ethereum)
        in: query
        name: coin
        type: string
      - description: Number of days to look back (default 30); use 1 for intraday
          hourly data
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_server.cryptoChartResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pkg_server.ResponseFailure'
      summary: Get crypto price chart data
      tags:
