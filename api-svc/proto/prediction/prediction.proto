syntax = "proto3";

package prediction;

option go_package = "go-stock-prediction/proto/prediction";

// PredictionService is the gRPC service exposed by the prediction microservice.
// The API backend calls these RPCs to trigger crawling, training, and prediction.
service PredictionService {
  // Trigger gold price crawl (SJC + XAU)
  rpc TriggerGoldCrawler(Empty) returns (TriggerResponse);

  // Trigger model training (optionally for a single algorithm)
  rpc TriggerTrain(TriggerTrainRequest) returns (TriggerTrainResponse);

  // Trigger prediction reconciliation (fill actual_price, accuracy, status)
  rpc TriggerReconcile(Empty) returns (TriggerResponse);

  // Trigger gold history import (XAU backfill)
  rpc TriggerGoldHistory(Empty) returns (TriggerResponse);

  // Trigger gold prediction
  rpc TriggerGoldPredict(Empty) returns (TriggerResponse);

  // Trigger historical walk-forward backtest
  rpc TriggerHistoricalBacktest(BacktestRequest) returns (TriggerResponse);

  // Get current training status
  rpc GetTrainingStatus(Empty) returns (TrainingStatusResponse);

  // NASDAQ 100
  rpc TriggerNasdaqCrawler(Empty) returns (TriggerResponse);
  rpc TriggerNasdaqPredict(Empty) returns (TriggerResponse);

  // Crypto
  rpc TriggerCryptoCrawler(Empty) returns (TriggerResponse);
  rpc TriggerCryptoPredict(Empty) returns (TriggerResponse);
  rpc TriggerCryptoHistory(Empty) returns (TriggerResponse);

  // S&P 500
  rpc TriggerSP500Crawler(Empty) returns (TriggerResponse);
  rpc TriggerSP500Predict(Empty) returns (TriggerResponse);

  // Trading Simulation
  rpc TriggerSimulationBacktest(SimulationRequest) returns (TriggerResponse);
  rpc TriggerSimulationLiveStep(Empty) returns (TriggerResponse);
  rpc ResetSimBots(Empty) returns (TriggerResponse);

  // Streaming pipeline predict — yields PipelineLogEvent during execution
  rpc StreamGoldPredict(Empty) returns (stream PipelineLogEvent);
  rpc StreamNasdaqPredict(Empty) returns (stream PipelineLogEvent);
  rpc StreamCryptoPredict(Empty) returns (stream PipelineLogEvent);
  rpc StreamSP500Predict(Empty) returns (stream PipelineLogEvent);

  // Rebuild & Replay — wipe all predictions + sim data, replay walk-forward
  // from cutoff+1 → today (out-of-sample), retrain meta, replay bots.
  // Runs in background; returns immediately (202-style).
  rpc TriggerRebuildReplay(RebuildReplayRequest) returns (TriggerResponse);

  // Query — generic read facade so api-svc can be DB-less. api-svc's gRPC-backed
  // DatabaseStore serializes params to JSON, calls Query(method, params_json), and
  // unmarshals result_json back into the Go model types (json tags = DB columns).
  // prediction-svc owns market_db and dispatches by method name.
  rpc Query(QueryRequest) returns (QueryResponse);
}

message QueryRequest {
  string method = 1;       // DatabaseStore method name, e.g. "GetLatestGoldPrices"
  string params_json = 2;  // JSON object of named params, e.g. {"limit":10}
}

message QueryResponse {
  string result_json = 1;  // JSON matching the Go return type (Decimal as string, time RFC3339 +07:00)
  string error = 2;        // non-empty on failure
}

message Empty {}

message TriggerResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}

message TriggerTrainRequest {
  string algorithm = 1; // empty = train all algorithms
}

message TriggerTrainResponse {
  bool success = 1;
  string session_id = 2;
  string message = 3;
  string error = 4;
}

message BacktestRequest {
  int32 train_window = 1;
  int32 step_size = 2;
  string market_key = 3; // "GOLD", "NASDAQ100", "CRYPTO", "SP500", "ALL" = all markets
}

message TrainingStatusResponse {
  bool is_training = 1;
  string last_trained = 2; // RFC3339 timestamp, empty if never trained
  double progress = 3;     // 0-100
  string current_phase = 4;
  int32 total_algorithms = 5;
  int32 done_algorithms = 6;
}

message SimulationRequest {
  string bot_id = 1;     // "" = all bots
  string start_date = 2; // "2024-01-01"
  string end_date = 3;   // "" = today
}

message PipelineLogEvent {
  string level = 1;    // "info" | "ok" | "warn" | "error"
  string msg = 2;
  float progress = 3;  // 0.0–1.0
  bool done = 4;       // true on last event
  string error = 5;    // non-empty on fatal error
}

message RebuildReplayRequest {
  // ISO date string "YYYY-MM-DD"; only predictions with target_date > cutoff are saved.
  // Empty = default "2026-06-13".
  string cutoff_date = 1;
  // Walk-forward step size in days; 0 = default 1.
  int32 step_size = 2;
}
