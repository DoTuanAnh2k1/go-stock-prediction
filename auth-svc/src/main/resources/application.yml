spring:
  application:
    name: auth-service
  output:
    ansi:
      enabled: always           # force ANSI colors in Docker (stdout is not a TTY)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:go_stock_prediction}?currentSchema=public
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns schema; JPA chỉ validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

grpc:
  server:
    port: ${GRPC_PORT:8120}
    security:
      enabled: false            # internal service, no TLS

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-ms: 86400000      # 24h

# Super-admin seed — supplied at deploy time via Secret, NEVER hardcoded.
# Blank/weak values fail startup (see SuperAdminSeeder).
superadmin:
  username: ${SUPER_ADMIN_USERNAME:}
  password: ${SUPER_ADMIN_PASSWORD:}

# =============================================================================
# Actuator (factor 14 — metrics + health probes).
# auth-svc là gRPC-only → thêm spring-boot-starter-web cấp Tomcat, chạy HTTP trên
# server.port=9464 (KHÔNG tách management context — đơn giản, chắc chắn có listener).
# gRPC vẫn ở grpc.server.port=8120 (riêng biệt, không đụng). /actuator/prometheus
# (metrics) và /actuator/health/{readiness,liveness} nằm trên :9464. Prometheus
# scrape qua pod annotation prometheus.io/port=9464.
# =============================================================================
server:
  port: ${MANAGEMENT_PORT:9464}       # Tomcat HTTP cho Actuator (gRPC tách riêng ở grpc.server.port)

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true          # health groups readiness/liveness cho k8s probe
      show-details: always
  metrics:
    tags:
      application: auth-svc

service-mgt:
  enabled: ${SERVICE_MGT_ENABLED:false}
  target: ${REGISTRY_GRPC_TARGET:service-mgt:8121}

logging:
  level:
    vn.gostock: INFO
    net.devh.boot.grpc: WARN
