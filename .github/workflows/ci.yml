name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Go API Backend  (api/)
  # ╚═══════════════════════════════════════════════════════════════════════════

  go-build:
    name: "[API] Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build -o /dev/null ./cmd

  # ─────────────────────────────────────────────────────────────────────────
  go-vet:
    name: "[API] Vet"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

  # ─────────────────────────────────────────────────────────────────────────
  # Handler tests use the recover/mock pattern (no live DB), so no database
  # service is needed here — see api/pkg/server/*_test.go.
  go-test:
    name: "[API] Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: |
          go test ./... -v -count=1 -short \
            -coverprofile=coverage.out \
            -timeout 120s \
            2>&1 | tee test-output.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Process results
        if: always()
        run: |
          go tool cover -func=coverage.out | grep total \
            | awk '{print $3}' > coverage-total.txt 2>/dev/null \
            || echo "N/A" > coverage-total.txt
          grep -E "^ok|^FAIL|^\?" test-output.txt \
            > package-results.txt 2>/dev/null || true

      - name: Write step summary
        if: always()
        run: |
          TOTAL=$(cat coverage-total.txt 2>/dev/null || echo "N/A")
          {
            echo "### Go Coverage: **${TOTAL}**"
            echo ""
            if [ -s package-results.txt ]; then
              echo "| Package | Status | Time | Coverage |"
              echo "|---------|:------:|------|:--------:|"
              while IFS= read -r line; do
                PKG=$(echo "$line" | awk '{print $2}' | sed 's|go-stock-prediction/||')
                if echo "$line" | grep -q "^ok"; then
                  TIME=$(echo "$line" | awk '{print $3}')
                  COV=$(echo "$line" | grep -oP 'coverage: \K[0-9.]+%' || echo "—")
                  echo "| \`${PKG}\` | ✅ | ${TIME} | ${COV} |"
                elif echo "$line" | grep -q "^FAIL"; then
                  TIME=$(echo "$line" | awk '{print $3}')
                  echo "| \`${PKG}\` | ❌ | ${TIME} | — |"
                else
                  echo "| \`${PKG}\` | ⏭ no test | — | — |"
                fi
              done < package-results.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-results
          retention-days: 7
          path: |
            api/coverage.out
            api/coverage-total.txt
            api/package-results.txt

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Java Auth Service  (auth-service/)
  # ╚═══════════════════════════════════════════════════════════════════════════

  java-test:
    name: "[Auth] Build & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test (Maven)
        run: mvn -B verify

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### Java Auth Service"
            echo ""
            if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
              echo "| Suite | Tests | Failures | Errors | Skipped |"
              echo "|-------|:-----:|:--------:|:------:|:-------:|"
              for f in target/surefire-reports/*.txt; do
                NAME=$(basename "$f" .txt | sed 's/^.*\.//')
                LINE=$(grep -m1 "Tests run:" "$f" || true)
                T=$(echo "$LINE" | grep -oP 'Tests run: \K[0-9]+' || echo "?")
                FA=$(echo "$LINE" | grep -oP 'Failures: \K[0-9]+' || echo "?")
                ER=$(echo "$LINE" | grep -oP 'Errors: \K[0-9]+' || echo "?")
                SK=$(echo "$LINE" | grep -oP 'Skipped: \K[0-9]+' || echo "?")
                echo "| \`${NAME}\` | ${T} | ${FA} | ${ER} | ${SK} |"
              done
            else
              echo "_No surefire reports found._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-results
          retention-days: 7
          path: auth-service/target/surefire-reports/

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Python Prediction Service  (prediction/)
  # ╚═══════════════════════════════════════════════════════════════════════════

  python-lint:
    name: "[Prediction] Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prediction

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prediction/pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.8.0"

      - name: Lint
        run: ruff check src/ tests/

  # ─────────────────────────────────────────────────────────────────────────
  python-test:
    name: "[Prediction] Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prediction

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prediction/pyproject.toml

      - name: Install base + dev deps
        run: pip install -e ".[dev]"

      - name: Install ML extras (best-effort — tests skip gracefully if missing)
        run: pip install -e ".[ml]" || true

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short \
            --junitxml=junit.xml \
            2>&1 | tee test-output.txt
          echo "PYTEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Write step summary
        if: always()
        run: |
          PASSED=$(grep -oP '\d+ passed' test-output.txt | tail -1 || echo "? passed")
          FAILED=$(grep -oP '\d+ failed' test-output.txt | tail -1 || true)
          SKIPPED=$(grep -oP '\d+ skipped' test-output.txt | tail -1 || true)
          SUMMARY="${PASSED}"
          [ -n "$FAILED" ]  && SUMMARY="${SUMMARY}, ${FAILED}"
          [ -n "$SKIPPED" ] && SUMMARY="${SUMMARY}, ${SKIPPED}"
          {
            echo "### Python Unit Tests: ${SUMMARY}"
            echo ""
            # Extract per-test results
            echo "| Test | Result |"
            echo "|------|:------:|"
            grep -E "^tests/unit/.*PASSED|^tests/unit/.*FAILED|^tests/unit/.*SKIPPED|^tests/unit/.*ERROR" \
              test-output.txt | while IFS= read -r line; do
              NAME=$(echo "$line" | awk '{print $1}' | sed 's|tests/unit/||')
              if echo "$line" | grep -q "PASSED"; then
                echo "| \`${NAME}\` | ✅ |"
              elif echo "$line" | grep -q "SKIPPED"; then
                echo "| \`${NAME}\` | ⏭ skipped |"
              else
                echo "| \`${NAME}\` | ❌ |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          retention-days: 7
          path: prediction/junit.xml

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Rust Gateway Service  (gateway-svc/)
  # ╚═══════════════════════════════════════════════════════════════════════════

  rust-gateway:
    name: "[Gateway] Build, Test & Clippy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-svc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway-svc

      # Style gates report issues but don't block the pipeline (retrofit onto
      # existing code). Tighten by removing continue-on-error once it's clean.
      - name: Format check
        run: cargo fmt --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Frontend  (frontend/)
  # ╚═══════════════════════════════════════════════════════════════════════════

  frontend-build:
    name: "[Frontend] Type-check & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Check bundle size
        run: |
          du -sh dist/ 2>/dev/null && echo "" || true
          find dist -name "*.js" -exec du -sh {} \; 2>/dev/null | sort -rh | head -5 || true

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Docker Builds (run after tests pass)
  # ╚═══════════════════════════════════════════════════════════════════════════

  docker-api:
    name: "[Docker] API Image"
    runs-on: ubuntu-latest
    needs: [go-build, go-vet, go-test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ─────────────────────────────────────────────────────────────────────────
  docker-auth:
    name: "[Docker] Auth Image"
    runs-on: ubuntu-latest
    needs: [java-test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: auth-service/Dockerfile
          push: false
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

  # ─────────────────────────────────────────────────────────────────────────
  docker-prediction:
    name: "[Docker] Prediction Image"
    runs-on: ubuntu-latest
    needs: [python-lint, python-test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: prediction/Dockerfile
          push: false
          cache-from: type=gha,scope=prediction
          cache-to: type=gha,mode=max,scope=prediction

  # ─────────────────────────────────────────────────────────────────────────
  docker-gateway:
    name: "[Docker] Gateway Image"
    runs-on: ubuntu-latest
    needs: [rust-gateway]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-svc
          file: gateway-svc/Dockerfile
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  # ─────────────────────────────────────────────────────────────────────────
  docker-frontend:
    name: "[Docker] Frontend Image"
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  CI Summary Report
  # ╚═══════════════════════════════════════════════════════════════════════════

  report:
    name: "CI Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - go-build
      - go-vet
      - go-test
      - java-test
      - python-lint
      - python-test
      - rust-gateway
      - frontend-build
      - docker-api
      - docker-auth
      - docker-prediction
      - docker-gateway
      - docker-frontend

    steps:
      - name: Download Go results
        uses: actions/download-artifact@v4
        with:
          name: go-results
        continue-on-error: true

      - name: Generate summary
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped)   echo "⏭" ;;
              *)         echo "❓" ;;
            esac
          }

          GO_BUILD="${{ needs.go-build.result }}"
          GO_VET="${{ needs.go-vet.result }}"
          GO_TEST="${{ needs.go-test.result }}"
          JAVA_TEST="${{ needs.java-test.result }}"
          PY_LINT="${{ needs.python-lint.result }}"
          PY_TEST="${{ needs.python-test.result }}"
          RUST_GW="${{ needs.rust-gateway.result }}"
          FE_BUILD="${{ needs.frontend-build.result }}"
          DK_API="${{ needs.docker-api.result }}"
          DK_AUTH="${{ needs.docker-auth.result }}"
          DK_PRED="${{ needs.docker-prediction.result }}"
          DK_GW="${{ needs.docker-gateway.result }}"
          DK_FE="${{ needs.docker-frontend.result }}"

          {
            echo "# CI Pipeline — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Service | Stage | Status |"
            echo "|---------|-------|:------:|"
            echo "| **Go API Backend** | Build | $(icon "$GO_BUILD") \`${GO_BUILD}\` |"
            echo "| | Vet | $(icon "$GO_VET") \`${GO_VET}\` |"
            echo "| | Unit Tests | $(icon "$GO_TEST") \`${GO_TEST}\` |"
            echo "| | Docker Image | $(icon "$DK_API") \`${DK_API}\` |"
            echo "| **Java Auth Service** | Build & Test | $(icon "$JAVA_TEST") \`${JAVA_TEST}\` |"
            echo "| | Docker Image | $(icon "$DK_AUTH") \`${DK_AUTH}\` |"
            echo "| **Python Prediction** | Lint (ruff) | $(icon "$PY_LINT") \`${PY_LINT}\` |"
            echo "| | Unit Tests | $(icon "$PY_TEST") \`${PY_TEST}\` |"
            echo "| | Docker Image | $(icon "$DK_PRED") \`${DK_PRED}\` |"
            echo "| **Rust Gateway** | Build, Test & Clippy | $(icon "$RUST_GW") \`${RUST_GW}\` |"
            echo "| | Docker Image | $(icon "$DK_GW") \`${DK_GW}\` |"
            echo "| **Frontend** | Type-check & Build | $(icon "$FE_BUILD") \`${FE_BUILD}\` |"
            echo "| | Docker Image | $(icon "$DK_FE") \`${DK_FE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Go coverage line
          if [ -f coverage-total.txt ]; then
            TOTAL=$(cat coverage-total.txt)
            {
              echo ""
              echo "---"
              echo "**Go coverage:** ${TOTAL}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Per-package table
          if [ -f package-results.txt ] && [ -s package-results.txt ]; then
            {
              echo ""
              echo "<details><summary>Go package details</summary>"
              echo ""
              echo "| Package | Status | Time | Coverage |"
              echo "|---------|:------:|------|:--------:|"
              while IFS= read -r line; do
                PKG=$(echo "$line" | awk '{print $2}' | sed 's|go-stock-prediction/||')
                if echo "$line" | grep -q "^ok"; then
                  TIME=$(echo "$line" | awk '{print $3}')
                  COV=$(echo "$line" | grep -oP 'coverage: \K[0-9.]+%' || echo "—")
                  echo "| \`${PKG}\` | ✅ | ${TIME} | ${COV} |"
                elif echo "$line" | grep -q "^FAIL"; then
                  TIME=$(echo "$line" | awk '{print $3}')
                  echo "| \`${PKG}\` | ❌ | ${TIME} | — |"
                else
                  echo "| \`${PKG}\` | ⏭ no test | — | — |"
                fi
              done < package-results.txt
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Final verdict
          FAILED_CORE=0
          for r in "$GO_BUILD" "$GO_VET" "$GO_TEST" "$JAVA_TEST" \
                   "$PY_LINT" "$PY_TEST" "$RUST_GW" "$FE_BUILD"; do
            [ "$r" = "failure" ] && FAILED_CORE=$((FAILED_CORE + 1))
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED_CORE" -eq 0 ]; then
            echo "## ✅ All core checks passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ ${FAILED_CORE} core check(s) failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
