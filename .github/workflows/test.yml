name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: go_stock_prediction_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: "3307"
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: test123
      TEST_MYSQL_DB: go_stock_prediction_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test ./... -v -count=1 -coverprofile=coverage.out -timeout 120s

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | grep total

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14
