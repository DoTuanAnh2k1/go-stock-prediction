services:
  # Database — TimescaleDB (PostgreSQL 16 with time-series extensions)
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-go_stock_prediction}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_stock_prediction"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "5432:5432"
    networks:
      - app-network

  # Prediction Service (gRPC) — Python implementation
  prediction:
    build:
      context: .
      dockerfile: prediction/Dockerfile
    container_name: prediction_service
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GRPC_SERVER_PORT: "8119"
      DB_DRIVER: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: go_stock_prediction
      POSTGRES_DEBUG: "true"
      LOG_LEVEL: DEBUG
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://localhost}"
    networks:
      - app-network

  # Auth Service (Java gRPC)
  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: go_stock_prediction
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: "8120"
    expose:
      - "8120"
    networks:
      - app-network

  # API Backend (HTTP)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_backend
    depends_on:
      db:
        condition: service_healthy
      prediction:
        condition: service_started
      auth:
        condition: service_started
    restart: unless-stopped
    environment:
      SERVER_PORT: "8118"
      GRPC_TARGET: "prediction:8119"
      DB_DRIVER: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: go_stock_prediction
      POSTGRES_DEBUG: "${POSTGRES_DEBUG:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_LOG_LEVEL: "${DB_LOG_LEVEL:-WARN}"
      API_KEY: ""
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      BACKUP_DIR: "/backups"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://localhost}"
      AUTH_GRPC_TARGET: "auth:8120"
    volumes:
      - backup_data:/backups
    networks:
      - app-network

  # Rust HTTP/HTTPS Gateway — handles ports 80/443, routes to api and frontend
  gateway:
    build:
      context: ./gateway-svc
      dockerfile: Dockerfile
    container_name: vnstock_gateway
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway-svc/certs:/etc/gateway/certs
    networks:
      - app-network

  # Frontend (React + Vite + Nginx) — serves static files on internal port 3000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vnstock_frontend
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app-network

  # pgAdmin — PostgreSQL web administration UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      - db
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backup_data:
