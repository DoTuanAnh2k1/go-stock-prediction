version: "3.8"

services:
  # Database
  db:
    image: mysql:8.0
    container_name: mysql_db
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: go_stock_prediction
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-network

  # Prediction Service (gRPC)
  prediction:
    build:
      context: .
      dockerfile: Dockerfile.prediction
    container_name: prediction_service
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GRPC_SERVER_PORT: "8119"
      DB_DRIVER: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123
      MYSQL_DB_NAME: go_stock_prediction
      MYSQL_DEBUG: "false"
      LOG_LEVEL: INFO
      DB_LOG_LEVEL: INFO
    networks:
      - app-network

  # API Backend (HTTP)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api_backend
    depends_on:
      db:
        condition: service_healthy
      prediction:
        condition: service_started
    restart: unless-stopped
    environment:
      SERVER_PORT: "8118"
      GRPC_TARGET: "prediction:8119"
      DB_DRIVER: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123
      MYSQL_DB_NAME: go_stock_prediction
      MYSQL_DEBUG: "false"
      LOG_LEVEL: INFO
      DB_LOG_LEVEL: INFO
      API_KEY: ""
    networks:
      - app-network

  # Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vnstock_frontend
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "36018:80"
    networks:
      - app-network

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_app
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 123
      MYSQL_ROOT_PASSWORD: 123
      UPLOAD_LIMIT: 100M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
