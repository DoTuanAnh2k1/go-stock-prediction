services:
  # Database
  db:
    image: mysql:8.0
    container_name: mysql_db
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: go_stock_prediction
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-network

  # Prediction Service (gRPC) — Python implementation
  prediction:
    build:
      context: .
      dockerfile: prediction/Dockerfile
    container_name: prediction_service
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GRPC_SERVER_PORT: "8119"
      DB_DRIVER: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB_NAME: go_stock_prediction
      MYSQL_DEBUG: "true"
      LOG_LEVEL: DEBUG
      BACKUP_DIR: "/backups"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://localhost}"
    volumes:
      - backup_data:/backups
    networks:
      - app-network

  # API Backend (HTTP)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_backend
    depends_on:
      db:
        condition: service_healthy
      prediction:
        condition: service_started
    restart: unless-stopped
    environment:
      SERVER_PORT: "8118"
      GRPC_TARGET: "prediction:8119"
      DB_DRIVER: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DB_NAME: go_stock_prediction
      MYSQL_DEBUG: "${MYSQL_DEBUG:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_LOG_LEVEL: "${DB_LOG_LEVEL:-WARN}"
      API_KEY: ""
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      BACKUP_DIR: "/backups"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://localhost}"
    volumes:
      - backup_data:/backups
    networks:
      - app-network

  # Frontend (React + Vite + Nginx) — single HTTPS gateway on :443
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vnstock_frontend
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs
    networks:
      - app-network

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_app
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 100M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  backup_data:
