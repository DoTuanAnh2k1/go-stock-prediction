version: "3.8"

services:
  # Database
  db:
    platform: linux/x86_64
    image: mysql:5.7
    container_name: mysql_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: weather_alerts_db
      MYSQL_USER: dbuser          # Thêm user này để phpMyAdmin dễ connect
      MYSQL_PASSWORD: password
    networks:
      - mysql-phpmyadmin

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_app
    restart: always
    ports:
      - "8090:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root              # Thêm này để auto login
      PMA_PASSWORD: 123      # Thêm này để auto login
      MYSQL_ROOT_PASSWORD: 123
      UPLOAD_LIMIT: 100M          # Tăng limit upload file
    networks:
      - mysql-phpmyadmin

networks:
  mysql-phpmyadmin:
    driver: bridge

volumes:
  db_data: