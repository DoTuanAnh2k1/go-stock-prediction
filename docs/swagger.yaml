          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Trigger gold prediction
      tags:
      - Triggers
  /api/trigger/historical-backtest:
    post:
      consumes:
      - application/json
      description: 'Starts a walk-forward backtest in the background via the prediction
        service. Accepts optional query params: train_window (default 30), step_size
        (default 6), and market (one of "", "VN30", "GOLD", "NASDAQ100", "CRYPTO",
        "FUEL"). Returns 409 if a backtest is already running.'
      parameters:
      - description: Minimum data points before first prediction (default 30)
        in: query
        name: train_window
        type: integer
      - description: Fold size — data points between retraining (default 6)
        in: query
        name: step_size
        type: integer
      - description: 'Target market key: VN30, GOLD, NASDAQ100, CRYPTO, FUEL (default:
          all)'
        in: query
        name: market
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Trigger walk-forward historical backtest
      tags:
      - Triggers
  /api/trigger/nasdaq-crawler:
    post:
      consumes:
      - application/json
      description: Starts a NASDAQ100 price crawl in the background via the prediction
        service. Returns 202 immediately.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Trigger NASDAQ100 crawler
      tags:
      - Triggers
  /api/trigger/nasdaq-predict:
    post:
      consumes:
      - application/json
      description: Runs a prediction for all NASDAQ100 instruments in the background
        via the prediction service. Returns 202 immediately.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Trigger NASDAQ100 prediction
      tags:
      - Triggers
  /api/trigger/predict:
    post:
      consumes:
      - application/json
      description: Runs weekly training and daily prediction synchronously across
        all registered markets via the prediction service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Trigger prediction run
      tags:
      - Triggers
  /api/trigger/reconcile:
    post:
      consumes:
      - application/json
      description: Runs prediction reconciliation immediately, filling in actual_price,
        accuracy, and status for past predictions. Runs synchronously with a 10-minute
        timeout.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Trigger prediction reconciliation
      tags:
      - Triggers
  /api/trigger/stock-history:
    post:
      consumes:
      - application/json
      description: Starts a historical VN30 stock price crawl in the background. Accepts
        an optional days query parameter (default 365, max 1000).
      parameters:
      - description: Number of historical days to crawl (default 365, max 1000)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
