    LSTM, ARIMA-GARCH, Ensemble) for VN30 stocks, gold, NASDAQ, crypto, and fuel prices.
  title: Go Stock Prediction API
  version: "1.0"
paths:
  /api/algorithms/backtest:
    get:
      description: Runs a walk-forward backtest on up to 500 recent price points for
        the given stock symbol using Moving Average, LSTM, and ARIMA-GARCH algorithms.
        Returns MAE, RMSE, MAPE, and directional accuracy for each algorithm. Requires
        at least 150 historical data points.
      parameters:
      - description: Stock symbol (e.g. VCB)
        in: query
        name: symbol
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      summary: Run algorithm backtest for a stock
      tags:
      - Algorithms
  /api/algorithms/comparison:
    get:
      description: Returns a side-by-side comparison of all prediction algorithms
        over a configurable lookback period. Includes average error, accuracy rate,
        total predictions, and the best-performing algorithm for the period.
      parameters:
      - description: Lookback period in days (default 30)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsapi.AlgorithmComparisonDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      summary: Compare algorithm performance
      tags:
      - Algorithms
