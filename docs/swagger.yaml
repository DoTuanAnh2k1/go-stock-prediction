  /api/trigger/train:
    post:
      consumes:
      - application/json
      description: Starts training for all algorithms or a specific algorithm. Returns
        409 if training is already in progress. The algorithm field is optional; if
        omitted, all algorithms are trained.
      parameters:
      - description: Training request (algorithm is optional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/server.TriggerTrainRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/server.TriggerTrainResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Trigger model training
      tags:
      - Triggers
  /api/users:
    get:
      description: Returns all registered users; requires admin role
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.userResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Creates a new user account; requires admin role. Role defaults
        to "user" if an invalid value is supplied
      parameters:
      - description: New user details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "409":
          description: Username already exists
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - Users
  /api/users/{id}:
    delete:
      description: Deletes a user by ID; requires admin role. An admin cannot delete
        their own account
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.ResponseFailure'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ResponseFailure'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Users
  /health:
    get:
      description: Returns full system health including database, config, and runtime
        metrics
      produces:
      - application/json
      responses:
        "200":
          description: System is healthy
          schema:
            $ref: '#/definitions/server.HealthStatus'
        "503":
          description: System is unhealthy or degraded
          schema:
            $ref: '#/definitions/server.HealthStatus'
      summary: Detailed health check
      tags:
      - health
  /health/ready:
    get:
      description: Returns 200 READY when the database is reachable, 503 NOT READY
        otherwise
      produces:
      - text/plain
      responses:
        "200":
          description: READY
          schema:
            type: string
        "503":
          description: NOT READY
          schema:
            type: string
      summary: Readiness check
      tags:
      - health
  /health/simple:
    get:
      description: Lightweight liveness probe — returns 200 OK when the process is
        running
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Simple health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'JWT token from POST /api/auth/login. Format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
